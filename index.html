            cell.classList.add('fn');
            cell.classList.add('wide');
          }
          if (item === '␣') {
            cell.classList.add('space');
            cell.textContent = 'space';
          }
          rowDiv.appendChild(cell);
        });
        grid.appendChild(rowDiv);
      });

      mFontSize = Math.min(window.innerWidth * 0.28, Math.max(30, Math.round(120 * (getVolume() / 0.8))));
      const mPadding = 16;
      const mDPR = window.devicePixelRatio || 1;

      mTextData = [[]];
      let mCursorCol = 0;
      let mCharId = 0;
      const mAnimations = new Map();
      let mAnimFrame = null;
      let mSpeedLevel = 1;
      const mSpeedKernings = [16, -4, -14];
      const mSpeedLabels = ['SLOW', 'MED', 'FAST'];

      const mMessages = ['welcome', 'hear the sound of typography', 'type to make your beat'];
      mMsgActive = true;
      let mMsgIndex = 0;
      let mMsgCharIdx = 0;
      let mMsgTimer = null;
      const mMsgTypeInterval = 120;

      function mMsgTypeNext() {
        if (!mMsgActive || !font) return;
        if (mMsgCharIdx === 0 && typeof loopEngine !== 'undefined') {
          loopEngine.onLoopStart();
        }
        const msg = mMessages[mMsgIndex];
        if (mMsgCharIdx < msg.length) {
          const ch = msg[mMsgCharIdx];
          const newChar = initCharObj({ char: ch, id: mCharId++, done: false, kerning: 0, fontSize: mFontSize });
          mTextData[0].splice(mCursorCol, 0, newChar);
          mCursorCol++;
          mCursorVisible = true;
          triggerCharFlash(newChar);
          pronounceChar(ch, false, newChar.fontType, newChar, { source: 'mmsg', msg, charIdx: mMsgCharIdx });
          const g = getGlyphForCharObj(newChar);
          const path = g ? g.getPath(0, 0, mFontSize) : { commands: [] };
          mAnimations.set(newChar.id, {
            progress: 0,
            startTime: performance.now(),
            totalCmds: path.commands.length || 1,
            direction: 1
          });
          mSchedule();
          mMsgCharIdx++;
          const interval = getSequencerInterval(newChar, mFontSize);
          mMsgTimer = setTimeout(mMsgTypeNext, interval);
        } else {
          mMsgTimer = setTimeout(mMsgStartDelete, 2500);
        }
      }

      function mMsgStartDelete() {
        if (!mMsgActive) return;
        mMsgDeleteNext();
      }

      function mMsgDeleteNext() {
        if (!mMsgActive) return;
        const line = mTextData[0];
        if (!line || line.length === 0) {
          mMsgIndex++;
          if (mMsgIndex >= mMessages.length) mMsgIndex = 0;
          mMsgCharIdx = 0;
          mSchedule();
          mMsgTimer = setTimeout(mMsgTypeNext, 400);
          return;
        }
        const hasNonDeleting = line.some(c => !c.deleting);
        if (hasNonDeleting) {
          const target = line.filter(c => !c.deleting).pop();
          if (target) {
            target.done = false;
            target.deleting = true;
            triggerCharFlash(target);
            pronounceChar(target.char, true, target.fontType, target);
            const g = getGlyphForCharObj(target);
            const path = g ? g.getPath(0, 0, mFontSize) : { commands: [] };
            mAnimations.set(target.id, {
              progress: 1,
              startTime: performance.now(),
              totalCmds: path.commands.length || 1,
              direction: -1
            });
            mCursorCol = Math.max(0, mCursorCol - 1);
            mCursorVisible = true;
            mSchedule();
          }
          mMsgTimer = setTimeout(mMsgDeleteNext, 30);
        } else {
          mMsgTimer = setTimeout(mMsgDeleteNext, 50);
        }
      }

      function mMsgStop() {
        mMsgActive = false;
        clearTimeout(mMsgTimer);
        mMsgTimer = null;
        clearTimeout(englishWordTimer);
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis) speechSynthesis.cancel();
      }

      function mSchedule() {
        if (!mAnimFrame) mAnimFrame = requestAnimationFrame(mRender);
      }
      mScheduleRef = mSchedule;
      mMsgStart = mMsgTypeNext;

      function mRender() {
        mAnimFrame = null;
        drawMobileInner();
        let active = false;
        for (const [id, a] of mAnimations) {
          if (a.direction === -1 || a.progress < 1) { active = true; break; }
        }
        if (!active && fadeEnabled) {
          const now = performance.now();
          for (const c of mTextData[0]) {
            if (c.doneTime && (now - c.doneTime) < FADE_DURATION) { active = true; break; }
          }
        }
        if (!active) {
          const nowCheck = performance.now();
          for (const c of mTextData[0]) {
            if (c.flashTime && (nowCheck - c.flashTime) < FLASH_DURATION) { active = true; break; }
          }
        }
        if (!active && (audioEnergy > 0.01 || audioEnergyTarget > 0.01)) active = true;
        if (!active && mMsgActive) active = true;
        if (!active && mAutoplayActive) active = true;
        if (active) mAnimFrame = requestAnimationFrame(mRender);
      }

      let mCursorVisible = true;
      let mBlinkTimer = setInterval(() => {
        mCursorVisible = !mCursorVisible;
        mSchedule();
      }, 530);

      mobileRedraw = drawMobileInner;
      function drawMobileInner() {
        if (!font) return;
        updateAudioEnergy();

        const vw = window.innerWidth;
        const canvasH = mCanvas.clientHeight || (mFontSize * 1.5 + mPadding * 2);
        if (mCanvas.width !== Math.round(vw * mDPR)) mCanvas.width = Math.round(vw * mDPR);
        if (mCanvas.height !== Math.round(canvasH * mDPR)) mCanvas.height = Math.round(canvasH * mDPR);
        mCtx.setTransform(mDPR, 0, 0, mDPR, 0, 0);

        const mBg = isDark ? '#000' : '#e6e6e6';
        const mFgVal = isDark ? 255 : 0;
        const mFg = mFgVal + ',' + mFgVal + ',' + mFgVal;
        mCtx.fillStyle = mBg;
        mCtx.fillRect(0, 0, vw, canvasH);

        const now = performance.now();

        const speed = getSpeed();
        const cmdPerSec = speed * 1.5;

        const toRemove = [];
        for (const [id, a] of mAnimations) {
          const elapsed = (now - a.startTime) / 1000;
          const total = a.totalCmds || 20;
          const raw = (elapsed * cmdPerSec) / total;
          if (a.direction === -1) {
            a.progress = Math.max(0, 1 - raw);
            if (a.progress <= 0) toRemove.push(id);
          } else {
            if (a.progress < 1) {
              a.progress = Math.min(1, raw);
              if (a.progress >= 1) {
                for (const c of mTextData[0]) {
                  if (c.id === id) { c.done = true; if (!c.doneTime) c.doneTime = now; }
                }
              }
            }
          }
        }
        for (const id of toRemove) {
          mAnimations.delete(id);
          const idx = mTextData[0].findIndex(c => c.id === id);
          if (idx !== -1) {
            mTextData[0].splice(idx, 1);
            if (mCursorCol > idx) mCursorCol = Math.max(0, mCursorCol - 1);
          }
        }

        const lineChars = mTextData[0];
        const text = lineChars.map(c => c.char).join('');
        const glyphs = font.stringToGlyphs(text);

        let fs = mFontSize;
        const maxW = vw - mPadding * 2;
        const maxRows = Math.max(1, Math.floor((canvasH - mPadding * 2) / (mFontSize * 1.2)));

        function calcRows(fontSize) {
          const sc = fontSize / font.unitsPerEm;
          const rows = [];
          let rs = 0, rw = 0;
          let lastSpace = -1, wAtSpace = 0;
          for (let i = 0; i < glyphs.length; i++) {
            const prevChar = i > 0 && lineChars[i - 1] ? lineChars[i - 1].char : null;
            const currentChar = lineChars[i] ? lineChars[i].char : null;

            let effectiveKerning = 0;
            if (kerningEnabled) {
              effectiveKerning = lineChars[i].kerning || 0;
            }
            effectiveKerning += getEffectiveKerning(prevChar, currentChar, globalKerning);

            const gw = glyphs[i].advanceWidth * sc + effectiveKerning;
            if (lineChars[i] && lineChars[i].char === ' ') {
              lastSpace = i;
              wAtSpace = rw + gw;
            }
            if (rw + gw > maxW && i > rs) {
              if (lastSpace > rs) {
                rows.push({ start: rs, end: lastSpace + 1, width: wAtSpace });
                rs = lastSpace + 1;
                rw = 0;
                for (let j = rs; j <= i; j++) {
                  const jPrevChar = j > rs && lineChars[j - 1] ? lineChars[j - 1].char : null;
                  const jCurrentChar = lineChars[j] ? lineChars[j].char : null;

                  let jEffectiveKerning = 0;
                  if (kerningEnabled) {
                    jEffectiveKerning = lineChars[j].kerning || 0;
                  }
                  jEffectiveKerning += getEffectiveKerning(jPrevChar, jCurrentChar, globalKerning);

                  rw += glyphs[j].advanceWidth * sc + jEffectiveKerning;
                }
                lastSpace = -1;
              } else {
                rows.push({ start: rs, end: i, width: rw });
                rs = i; rw = gw;
              }
              continue;
            }
            rw += gw;
          }
          rows.push({ start: rs, end: glyphs.length, width: rw });
          return rows;
        }

        let displayRows = calcRows(fs);
        while (displayRows.length > maxRows && fs > 20) {
          fs *= 0.85;
          displayRows = calcRows(fs);
        }

        const scale = fs / font.unitsPerEm;
        const asc = font.ascender * scale;
        const desc = -font.descender * scale;
        const xHeight = (font.tables.os2 && font.tables.os2.sxHeight)
          ? font.tables.os2.sxHeight * scale
          : asc * 0.52;
        const lineH = (asc + desc + 4) * 0.8;

        const totalH = displayRows.length * lineH;
        const startY = Math.max(mPadding, (canvasH - totalH) / 2);

        for (let ri = 0; ri < displayRows.length; ri++) {
          const row = displayRows[ri];
          const baseline = startY + ri * lineH + asc;
          const ascenderY = baseline - asc;
          const xHeightY = baseline - xHeight;
          const descenderY = baseline + desc;

          if (ri === 0 && showMetrics) {
            // Mobile also shows type metrics like desktop.
            mCtx.save();
            mCtx.setLineDash([4, 4]);
            mCtx.lineWidth = 0.6;
            mCtx.strokeStyle = 'rgba(' + mFg + ',0.28)';
            mCtx.beginPath();
            mCtx.moveTo(mPadding - 6, ascenderY);
            mCtx.lineTo(vw - mPadding + 6, ascenderY);
            mCtx.moveTo(mPadding - 6, xHeightY);
            mCtx.lineTo(vw - mPadding + 6, xHeightY);
            mCtx.moveTo(mPadding - 6, baseline);
            mCtx.lineTo(vw - mPadding + 6, baseline);
            mCtx.moveTo(mPadding - 6, descenderY);
            mCtx.lineTo(vw - mPadding + 6, descenderY);
            mCtx.stroke();
            mCtx.setLineDash([]);
            mCtx.restore();
          }

          let x = mPadding;

          for (let gi = row.start; gi < row.end; gi++) {
            const glyph = glyphs[gi];
            const charObj = lineChars[gi];
            let progress = 1;
            if (charObj && !charObj.done) {
              const a = mAnimations.get(charObj.id);
              if (a) progress = a.progress;
              else if (mAutoplayActive) progress = 0;
            }
            const isDeleting = charObj && charObj.deleting;
            let fadeT = 1;
            if (fadeEnabled && charObj && charObj.doneTime && !isDeleting) {
              fadeT = Math.min(1, (now - charObj.doneTime) / FADE_DURATION);
            }

            const charW = glyph.advanceWidth * scale;
            if (charObj && charObj.flashTime) {
              const ft = 1 - Math.min(1, (now - charObj.flashTime) / FLASH_DURATION);
              if (ft > 0) {
                let flashStyle;
                if (colorPalette === 'rainbow') {
                  const hue = getCharHue(charObj, gi);
                  flashStyle = 'hsla(' + hue + ', 100%, 50%, ' + (ft * 0.45).toFixed(3) + ')';
                } else if (colorPalette === 'mono') {
                  flashStyle = 'rgba(' + mFg + ', ' + (ft * 0.35).toFixed(3) + ')';
                } else {
                  flashStyle = 'rgba(255, 0, 0, ' + (ft * 0.8).toFixed(3) + ')';
                }
                const pad = 4;
                mCtx.fillStyle = flashStyle;
                mCtx.fillRect(x - pad, baseline - asc - pad, charW + pad * 2, lineH + pad * 2);
              }
            }
            const path = glyph.getPath(x, baseline, fs);
            const cmds = path.commands;
            const vis = Math.ceil(progress * cmds.length);
            const e = audioEnergy;
            const mwf = waveIntensity / 50;
            const waveOn = e > 0.005 && waveIntensity > 0;
            const SUB = waveOn ? Math.max(2, Math.round(mwf * 10)) : 0;

            let mwCx = 0, mwCy = 0, mwMaxR = 1;
            if (waveOn) {
              let xMn = Infinity, xMx = -Infinity, yMn = Infinity, yMax = -Infinity;
              for (let i = 0; i < vis; i++) {
                const c = cmds[i];
                if (c.x !== undefined) { if (c.x < xMn) xMn = c.x; if (c.x > xMx) xMx = c.x; if (c.y < yMn) yMn = c.y; if (c.y > yMx) yMx = c.y; }
                if (c.x1 !== undefined) { if (c.x1 < xMn) xMn = c.x1; if (c.x1 > xMx) xMx = c.x1; if (c.y1 < yMn) yMn = c.y1; if (c.y1 > yMx) yMx = c.y1; }
                if (c.x2 !== undefined) { if (c.x2 < xMn) xMn = c.x2; if (c.x2 > xMx) xMx = c.x2; if (c.y2 < yMn) yMn = c.y2; if (c.y2 > yMx) yMx = c.y2; }
              }
              mwCx = (xMn + xMx) / 2;
              mwCy = (yMn + yMx) / 2;
              mwMaxR = Math.max(1, Math.hypot(xMx - xMn, yMx - yMn) / 2);
            }

            function mw(px, py) {
              if (!waveOn) return { x: px, y: py };

              const ddx = px - mwCx;
              const ddy = py - mwCy;
              const dist = Math.hypot(ddx, ddy);
              const t = Math.min(1, dist / mwMaxR);
              const binF = t * (WAVE_BINS - 1);
              const lo = Math.floor(binF);
              const hi = Math.min(lo + 1, WAVE_BINS - 1);
              const frac = binF - lo;
              const amp = waveData[lo] * (1 - frac) + waveData[hi] * frac;
              const phase = t * Math.PI * 6 + now * 0.005;
              const displacement = Math.sin(phase) * amp * fs * 0.06 * mwf;
              const angle = Math.atan2(ddy, ddx);
              return { x: px + Math.cos(angle) * displacement, y: py + Math.sin(angle) * displacement };
            }

            mCtx.beginPath();
            let pcx = 0, pcy = 0;
            for (let i = 0; i < vis; i++) {
              const cmd = cmds[i];
              if (SUB > 0) {
                switch (cmd.type) {
                  case 'M': { const p = mw(cmd.x, cmd.y); mCtx.moveTo(p.x, p.y); pcx = cmd.x; pcy = cmd.y; break; }
                  case 'L': {
                    for (let s = 1; s <= SUB; s++) {
                      const t = s / SUB;
                      const p = mw(pcx + (cmd.x - pcx) * t, pcy + (cmd.y - pcy) * t);
                      mCtx.lineTo(p.x, p.y);
                    }
                    pcx = cmd.x; pcy = cmd.y; break;
                  }
                  case 'Q': {
                    for (let s = 1; s <= SUB; s++) {
                      const t = s / SUB, mt = 1 - t;
                      const p = mw(mt*mt*pcx + 2*mt*t*cmd.x1 + t*t*cmd.x, mt*mt*pcy + 2*mt*t*cmd.y1 + t*t*cmd.y);
                      mCtx.lineTo(p.x, p.y);
                    }
                    pcx = cmd.x; pcy = cmd.y; break;
                  }
                  case 'C': {
                    for (let s = 1; s <= SUB; s++) {
                      const t = s / SUB, mt = 1 - t;
                      const p = mw(
                        mt*mt*mt*pcx + 3*mt*mt*t*cmd.x1 + 3*mt*t*t*cmd.x2 + t*t*t*cmd.x,
                        mt*mt*mt*pcy + 3*mt*mt*t*cmd.y1 + 3*mt*t*t*cmd.y2 + t*t*t*cmd.y
                      );
                      mCtx.lineTo(p.x, p.y);
                    }
                    pcx = cmd.x; pcy = cmd.y; break;
                  }
                  case 'Z': mCtx.closePath(); break;
                }
              } else {
                switch (cmd.type) {
                  case 'M': mCtx.moveTo(cmd.x, cmd.y); pcx = cmd.x; pcy = cmd.y; break;
                  case 'L': mCtx.lineTo(cmd.x, cmd.y); pcx = cmd.x; pcy = cmd.y; break;
                  case 'Q': mCtx.quadraticCurveTo(cmd.x1, cmd.y1, cmd.x, cmd.y); pcx = cmd.x; pcy = cmd.y; break;
                  case 'C': mCtx.bezierCurveTo(cmd.x1, cmd.y1, cmd.x2, cmd.y2, cmd.x, cmd.y); pcx = cmd.x; pcy = cmd.y; break;
                  case 'Z': mCtx.closePath(); break;
                }
              }
            }

            let myMin = Infinity, myMax = -Infinity;
            for (let i = 0; i < vis; i++) {
              const c = cmds[i];
              if (c.y !== undefined) { if (c.y < myMin) myMin = c.y; if (c.y > myMax) myMax = c.y; }
              if (c.y1 !== undefined) { if (c.y1 < myMin) myMin = c.y1; if (c.y1 > myMax) myMax = c.y1; }
              if (c.y2 !== undefined) { if (c.y2 < myMin) myMin = c.y2; if (c.y2 > myMax) myMax = c.y2; }
            }
            if (!isFinite(myMin) || myMax - myMin < 8) {
              myMin = baseline - asc;
              myMax = baseline + desc;
            }

            const mFillColor = getGlyphFillColor(charObj, progress, fadeT, isDeleting, mShowFill, isDark, mFg);
            if (isDeleting && progress < 1) {
              mCtx.fillStyle = mFillColor;
              mCtx.fill();
            } else if (progress < 1) {
              mCtx.fillStyle = mFillColor;
              mCtx.fill();
            } else if (fadeT < 1) {
              mCtx.fillStyle = mFillColor;
              mCtx.fill();
            } else if (mShowFill && !isDeleting) {
              mCtx.fillStyle = mFillColor;
              mCtx.fill();
            }

            if (!mShowFill) {
              const mew = e * mwf;
              mCtx.strokeStyle = getGlyphStrokeColor(charObj, isDark, mFg, e, mwf);
              mCtx.lineWidth = 1 + mew * 2.5;
              mCtx.stroke();
            }

            const mVtxAlpha = fadeEnabled ? Math.max(0, 1 - fadeT) : 1;

            // Get previous character for optical kerning
            const prevChar = gi > 0 && dl.chars[gi - 1] ? dl.chars[gi - 1].char : null;
            const currentChar = charObj ? charObj.char : null;

            // Apply kerning based on mode
            let effectiveKerning = 0;
            if (kerningEnabled) {
              effectiveKerning = charObj.kerning || 0;
            }
            effectiveKerning += getEffectiveKerning(prevChar, currentChar, globalKerning);

            x += charW + effectiveKerning;
          }
        }

        if (mCursorVisible) {
          const curFs = fs;
          const curScale = curFs / font.unitsPerEm;
          const curAsc = font.ascender * curScale;
          const curDesc = -font.descender * curScale;
          const curLineH = (curAsc + curDesc + 4) * 0.8;

          if (displayRows.length === 0 || (displayRows.length === 1 && displayRows[0].end === 0)) {
            const cy = canvasH / 2;
            const cx = mPadding;
            mCtx.strokeStyle = 'rgba(' + mFgVal + ',' + mFgVal + ',' + mFgVal + ',0.9)';
            mCtx.lineWidth = 1.5;
            mCtx.beginPath();
            mCtx.moveTo(cx, cy - curAsc * 0.5);
            mCtx.lineTo(cx, cy + curDesc * 0.5);
            mCtx.stroke();
          } else {
            let cursorGi = mCursorCol;
            let curRow = 0;
            for (let ri = 0; ri < displayRows.length; ri++) {
              const row = displayRows[ri];
              if (cursorGi <= row.end - row.start || ri === displayRows.length - 1) {
                curRow = ri;
                break;
              }
              cursorGi -= (row.end - row.start);
            }
            const row = displayRows[curRow];
            const curBaseline = startY + curRow * curLineH + curAsc;
            let cx = mPadding;
            const end = Math.min(row.start + cursorGi, row.end);
            for (let gi = row.start; gi < end; gi++) {
              const prevChar = gi > row.start && lineChars[gi - 1] ? lineChars[gi - 1].char : null;
              const currentChar = lineChars[gi] ? lineChars[gi].char : null;

              let effectiveKerning = 0;
              if (kerningEnabled) {
                effectiveKerning = lineChars[gi].kerning || 0;
              }
              effectiveKerning += getEffectiveKerning(prevChar, currentChar, globalKerning);

              cx += glyphs[gi].advanceWidth * curScale + effectiveKerning;
            }
            mCtx.strokeStyle = 'rgba(' + mFgVal + ',' + mFgVal + ',' + mFgVal + ',0.9)';
            mCtx.lineWidth = 1.5;
            mCtx.beginPath();
            mCtx.moveTo(cx, curBaseline - curAsc);
            mCtx.lineTo(cx, curBaseline + curDesc);
            mCtx.stroke();
          }
        }
      }

      function mResetBlink() {
        mCursorVisible = true;
        clearInterval(mBlinkTimer);
        mBlinkTimer = setInterval(() => {
          mCursorVisible = !mCursorVisible;
          mSchedule();
        }, 530);
      }

      function mInsert(key) {
        mResetAutoplayTimer();
        if (mMsgActive) {
          mMsgStop();
          mTextData[0].length = 0;
          mCursorCol = 0;
          mAnimations.clear();
        }
        mResetBlink();
        if (!font) return;
        const ch = key.toLowerCase();
        const newChar = initCharObj({ char: ch, id: mCharId++, done: false, kerning: 0, fontSize: mFontSize });
        tagMobileTyping(newChar);
        mTextData[0].splice(mCursorCol, 0, newChar);
        mCursorCol++;
        triggerCharFlash(newChar);
        pronounceChar(ch, false, newChar.fontType, newChar, { source: 'mtyping', mTextData, cursorCol: mCursorCol });

        const g = getGlyphForCharObj(newChar);
        const path = g ? g.getPath(0, 0, mFontSize) : { commands: [] };
        mAnimations.set(newChar.id, {
          progress: 0,
          startTime: performance.now(),
          totalCmds: path.commands.length || 1,
          direction: 1
        });
        mSchedule();
      }

      function mBackspace() {
        mResetAutoplayTimer();
        clearTimeout(englishWordTimer);
        if (mMsgActive) {
          mMsgStop();
          mTextData[0].length = 0;
          mCursorCol = 0;
          mAnimations.clear();
          mSchedule();
          return;
        }
        mResetBlink();
        if (mCursorCol <= 0) return;
        const target = mTextData[0][mCursorCol - 1];
        if (!target || target.deleting) return;
        triggerCharFlash(target);
        pronounceChar(target.char, true, target.fontType, target);
        target.done = false;
        target.deleting = true;
        const g = getGlyphForCharObj(target);
        const path = g ? g.getPath(0, 0, mFontSize) : { commands: [] };
        mAnimations.set(target.id, {
          progress: 1,
          startTime: performance.now(),
          totalCmds: path.commands.length || 1,
          direction: -1
        });
        mCursorCol--;
        mSchedule();
      }

      function mDelete() {
        mResetAutoplayTimer();
        clearTimeout(englishWordTimer);
        if (mCursorCol >= mTextData[0].length) return;
        const target = mTextData[0][mCursorCol];
        if (!target || target.deleting) return;
        triggerCharFlash(target);
        pronounceChar(target.char, true, target.fontType, target);
        target.done = false;
        target.deleting = true;
        const g = getGlyphForCharObj(target);
        const path = g ? g.getPath(0, 0, mFontSize) : { commands: [] };
        mAnimations.set(target.id, {
          progress: 1,
          startTime: performance.now(),
          totalCmds: path.commands.length || 1,
          direction: -1
        });
        mSchedule();
      }

      function mClearAll() {
        mStopAutoplay();
        mTextData[0].length = 0;
        mCursorCol = 0;
        mAnimations.clear();
        mSchedule();
      }

      let mAutoplayActive = false;
      let mAutoplayTimer = null;
      let mAutoplaySeqTimer = null;
      let mAutoplayIdx = -1;
      let lastMobileTypeAt = 0;

      function tagMobileTyping(charObj) {
        if (!charObj) return;
        const now = performance.now();
        if (lastMobileTypeAt > 0) {
          charObj.replayInterval = Math.max(40, Math.min(1200, now - lastMobileTypeAt));
        }
        lastMobileTypeAt = now;
      }

      function mResetAutoplayTimer() {
        mStopAutoplay();
        clearTimeout(mAutoplayTimer);
        if (mMsgActive || !repeatEnabled) return;
        const chars = mTextData[0].filter(c => !c.deleting);
        if (chars.length > 0) {
          mAutoplayTimer = setTimeout(mStartAutoplay, AUTOPLAY_DELAY);
        }
      }

      function mStartAutoplay() {
        if (mMsgActive || !repeatEnabled) return;
        const chars = mTextData[0].filter(c => !c.deleting);
        if (chars.length === 0) return;
        if (typeof loopEngine !== 'undefined') {
          loopEngine.onLoopStart();
        }
        mAutoplayActive = true;
        mAutoplayIdx = -1;
        for (const c of chars) {
          c.done = false;
          c.doneTime = null;
          mAnimations.delete(c.id);
        }
        if (typeof updateRepeatUI === 'function') updateRepeatUI();
        mSchedule();
        mStepAutoplay();
      }

      function mStopAutoplay() {
        if (mAutoplayActive) {
          for (const c of mTextData[0]) {
            if (!c.deleting && !c.done) {
              c.done = true;
              c.doneTime = performance.now();
            }
            mAnimations.delete(c.id);
          }
        }
        mAutoplayActive = false;
        mAutoplayIdx = -1;
        clearTimeout(mAutoplaySeqTimer);
        mAutoplaySeqTimer = null;
        clearTimeout(englishWordTimer);
        if (typeof updateRepeatUI === 'function') updateRepeatUI();
        mSchedule();
      }

      function mStepAutoplay() {
        if (!mAutoplayActive || mMsgActive || !repeatEnabled) { mStopAutoplay(); return; }
        mAutoplayIdx++;
        const line = mTextData[0];
        while (mAutoplayIdx < line.length) {
          const ch = line[mAutoplayIdx];
          if (ch && !ch.deleting) {
            ch.done = false;
            ch.doneTime = null;
            const g = getGlyphForCharObj(ch);
            const path = g ? g.getPath(0, 0, mFontSize) : { commands: [] };
            const totalCmds = path.commands.length || 1;
            mAnimations.set(ch.id, {
              progress: 0,
              startTime: performance.now(),
              totalCmds: totalCmds,
              direction: 1
            });
            pronounceChar(ch.char, false, ch.fontType, ch, { source: 'mautoplay', line, index: mAutoplayIdx });
            mSchedule();
            const interval = getSequencerInterval(ch, mFontSize);
            mAutoplaySeqTimer = setTimeout(mStepAutoplay, interval);
            return;
          }
          mAutoplayIdx++;
        }
        if (!repeatEnabled) { mStopAutoplay(); return; }
        mAutoplaySeqTimer = setTimeout(mStartAutoplay, AUTOPLAY_DELAY);
      }


      function flashCell(cell) {
        cell.classList.add('flash');
        setTimeout(() => cell.classList.remove('flash'), 150);
      }

      let speechUnlocked = false;
      function unlockSpeech() {
        if (speechUnlocked) return;
        try {
          const u = new SpeechSynthesisUtterance('');
          u.volume = 0;
          speechSynthesis.speak(u);
          const ac = getDrumCtx();
          const b = ac.createBuffer(1, 1, ac.sampleRate);
          const s = ac.createBufferSource();
          s.buffer = b;
          s.connect(ac.destination);
          s.start();
        } catch(err) {}
        speechUnlocked = true;
      }

      grid.addEventListener('touchstart', (e) => {
        for (const touch of e.changedTouches) {
          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          if (el && el.classList.contains('grid-cell')) flashCell(el);
        }
      }, { passive: true });

      mCanvas.addEventListener('click', () => {
        const showing = grid.classList.toggle('visible');
        if (showing && mMsgActive) {
          mMsgStop();
          mTextData[0].length = 0;
          mCursorCol = 0;
          mAnimations.clear();
          mResetBlink();
          mSchedule();
        }
      });

      grid.addEventListener('click', (e) => {
        unlockSpeech();
        const el = e.target.closest('.grid-cell');
        if (!el) return;
        const key = el.dataset.key;
        if (key === '⌫') { mBackspace(); }
        else if (key === '␣') { mInsert(' '); }
        else if (key === '⏎') {}
        else if (key === ' ') {}
        else { mInsert(key); }
      });

      document.getElementById('mClear').addEventListener('click', mClearAll);
      const mFontBtn = document.getElementById('mFont');
      if (mFontBtn) {
        const fontKeys = ['inter', 'roboto-slab', 'space-grotesk'];
        mFontBtn.addEventListener('click', async () => {
          const currentKey = getActiveFontKey();
          const nextIdx = (fontKeys.indexOf(currentKey) + 1) % fontKeys.length;
          const nextKey = fontKeys[nextIdx];
          if (fontSelect) fontSelect.value = nextKey;
          await loadFont(false);
        });
      }

      document.getElementById('mSound').classList.add('blink');
      document.getElementById('mSound').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        if (soundEnabled) {
          const ctx = getDrumCtx();
          if (ctx.state === 'suspended') ctx.resume();
          try {
            const u = new SpeechSynthesisUtterance('');
            u.volume = 0;
            window.speechSynthesis.speak(u);
          } catch (e) {}
        }
        updateSoundToggleUI();
        updateAmbientDroneState();
      });

      // Mobile polyphony toggle
      const mPolyphonyBtn = document.getElementById('mPolyphony');
      if (mPolyphonyBtn) {
        const polyphonyModes = ['off', 'ambient-electric', 'ambient-alphabet', 'electric-alphabet', 'custom'];
        mPolyphonyBtn.addEventListener('click', () => {
          const currentIdx = polyphonyModes.indexOf(polyphonyMode);
          const nextIdx = (currentIdx + 1) % polyphonyModes.length;
          polyphonyMode = polyphonyModes[nextIdx];
          if (polyphonyMode !== 'custom') {
            const modes = {
              'ambient-electric': 'roboto-slab',
              'ambient-alphabet': 'roboto-slab',
              'electric-alphabet': 'inter'
            };
            secondaryFontKey = modes[polyphonyMode] || 'roboto-slab';
          }
          if (window.updatePolyphonyUI) window.updatePolyphonyUI();
          mPolyphonyBtn.textContent = 'POLY: ' + (polyphonyMode === 'off' ? 'OFF' : polyphonyMode.toUpperCase().replace('-', ' + '));
          if (typeof loadFont === 'function') loadFont(false);
        });
      }

      // Mobile layer toggle
      const mLayerBtn = document.getElementById('mLayer');
      if (mLayerBtn) {
        const layerModes = ['single', 'double', 'blended'];
        mLayerBtn.addEventListener('click', () => {
          const currentIdx = layerModes.indexOf(layerMode);
          const nextIdx = (currentIdx + 1) % layerModes.length;
          layerMode = layerModes[nextIdx];
          if (window.updateLayerUI) window.updateLayerUI();
          mLayerBtn.textContent = 'LAYER: ' + layerMode.toUpperCase();
          if (typeof scheduleFrame === 'function') scheduleFrame();
        });
      }

      // Mobile gradation toggle
      const mGradationBtn = document.getElementById('mGradation');
      if (mGradationBtn) {
        const gradationModes = ['off', 'energy', 'frequency', 'spectrum'];
        mGradationBtn.addEventListener('click', () => {
          const currentIdx = gradationModes.indexOf(gradationMode);
          const nextIdx = (currentIdx + 1) % gradationModes.length;
          gradationMode = gradationModes[nextIdx];
          if (window.updateGradationUI) window.updateGradationUI();
          mGradationBtn.textContent = 'GRAD: ' + (gradationMode === 'off' ? 'OFF' : gradationMode.toUpperCase());
          if (typeof scheduleFrame === 'function') scheduleFrame();
        });
      }

      // Mobile metrics toggle
      const mMetricsBtn = document.getElementById('mMetrics');
      if (mMetricsBtn) {
        mMetricsBtn.classList.add('active'); // Start with active since showMetrics = true
        mMetricsBtn.addEventListener('click', () => {
          showMetrics = !showMetrics;
          mMetricsBtn.textContent = 'METRICS: ' + (showMetrics ? 'ON' : 'OFF');
          mMetricsBtn.classList.toggle('active', showMetrics);
          if (typeof mSchedule === 'function') mSchedule();
        });
      }

      // Mobile clock toggle
      const mClockBtn = document.getElementById('mClock');
      if (mClockBtn) {
        mClockBtn.addEventListener('click', () => {
          clockMode = !clockMode;
          mClockBtn.textContent = 'CLOCK: ' + (clockMode ? 'ON' : 'OFF');
          mClockBtn.classList.toggle('active', clockMode);

          if (clockMode) {
            // Clear existing text and start clock
            if (typeof mClearAll === 'function') mClearAll();
            mTextData = [[]];
            mCursorLine = 0;
            mCursorCol = 0;
            lastClockTime = '';
            window.updateMobileClockDisplay();
            if (!clockTimer) {
              clockTimer = setInterval(window.updateMobileClockDisplay, 1000);
            }
          } else {
            // Stop clock
            clearInterval(clockTimer);
            clockTimer = null;
            mTextData = [[]];
            mCursorLine = 0;
            mCursorCol = 0;
            // Start mobile message
            if (typeof mMsgStart === 'function') mMsgStart();
          }
          if (typeof mSchedule === 'function') mSchedule();
        });
      }

      window.updateMobileClockDisplay = function() {
        if (!clockMode) return;

        const currentTime = window.getClockTime();

        if (currentTime !== lastClockTime) {
          // Clear previous display
          mTextData = [[], [], []]; // 3 lines for hours, minutes, seconds
          mCursorLine = 0;
          mCursorCol = 0;

          // Split time into groups: HH, MM, SS
          const hours = currentTime.substring(0, 2);
          const minutes = currentTime.substring(2, 4);
          const seconds = currentTime.substring(4, 6);

          const timeGroups = [hours, minutes, seconds];

          // Display each group on separate line
          timeGroups.forEach((group, lineIndex) => {
            const groupChars = group.split('');
            groupChars.forEach((char, charIndex) => {
              setTimeout(() => {
                const newChar = initCharObj({
                  char: char,
                  id: mCharId++,
                  done: false,
                  kerning: 0,
                  fontSize: mFontSize * 1.8
                });
                mTextData[lineIndex].push(newChar);

                // Play sound for each character
                if (soundEnabled) {
                  pronounceChar(char, false, newChar.fontType, newChar, { source: 'clock' });
                }

                // Animate character
                const g = getGlyphForCharObj(newChar);
                const path = g ? g.getPath(0, 0, newChar.fontSize) : { commands: [] };
                const totalCmds = path.commands.length || 1;
                mAnimations.set(newChar.id, {
                  progress: 0,
                  startTime: performance.now(),
                  totalCmds: totalCmds,
                  direction: 1
                });
                triggerCharFlash(newChar);
                if (typeof mSchedule === 'function') mSchedule();
              }, (lineIndex * 200) + (charIndex * 80)); // Stagger by line then by character
            });
          });

          lastClockTime = currentTime;
        }
      };
      document.getElementById('mFill').addEventListener('click', () => {
        updateFillState(!showFill);
        mSchedule();
        if (typeof scheduleFrame === 'function') scheduleFrame();
      });
      document.getElementById('mSpeed').addEventListener('click', () => {
        mSpeedLevel = (mSpeedLevel + 1) % mSpeedKernings.length;
        globalKerning = mSpeedKernings[mSpeedLevel];
        if (kerningSlider) {
          kerningSlider.value = globalKerning;
          updateKerningUI();
        }
        document.getElementById('mSpeed').textContent = 'SPEED: ' + mSpeedLabels[mSpeedLevel];
        mSchedule();
      });

      const mWaveLevels = [0, 25, 50, 100, 150, 200];
      let mWaveIdx = 5;
      const mWaveBtn = document.getElementById('mWave');
      mWaveBtn.addEventListener('click', () => {
        mWaveIdx = (mWaveIdx + 1) % mWaveLevels.length;
        waveIntensity = mWaveLevels[mWaveIdx];
        mWaveBtn.textContent = 'WAVE: ' + waveIntensity;
        mSchedule();
      });

      const mVolBtn = document.getElementById('mVol');
      if (mVolBtn) {
        const volLevels = [0.5, 0.8, 1.0];
        let mVolIdx = 1;
        mVolBtn.addEventListener('click', () => {
          mVolIdx = (mVolIdx + 1) % volLevels.length;
          const newVol = volLevels[mVolIdx];
          if (volumeSlider) {
            volumeSlider.value = Math.round(newVol * 100);
          }
          updateVolumeUI();
        });
      }

      const mPaletteBtn = document.getElementById('mPalette');
      if (mPaletteBtn) {
        mPaletteBtn.addEventListener('click', () => {
          const nextIdx = (PALETTE_KEYS.indexOf(colorPalette) + 1) % PALETTE_KEYS.length;
          updatePalette(PALETTE_KEYS[nextIdx]);
        });
      }

      const mCameraBtn = document.getElementById('mCamera');
      if (mCameraBtn) {
        mCameraBtn.addEventListener('click', () => {
          updateCameraFollowState(!cameraFollow);
        });
      }

      const mLoopBtn = document.getElementById('mLoop');
      if (mLoopBtn) {
        mLoopBtn.addEventListener('click', () => {
          cycleLoopMode();
        });
      }
      const mRepeatBtn = document.getElementById('mRepeat');
      if (mRepeatBtn) {
        mRepeatBtn.addEventListener('click', () => {
          toggleRepeat();
        });
      }
      if (typeof updateLoopUI === 'function') {
        updateLoopUI();
      }
      if (typeof updateRepeatUI === 'function') {
        updateRepeatUI();
      }
    }
  </script>
</body>
</html>
