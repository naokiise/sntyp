<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>sonitype</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="dc2bae57-f259-4f89-88c9-732fe4076c80"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e6e6e6;
      --fg: #000;
      --fg-90: rgba(0,0,0,0.9);
      --fg-50: rgba(0,0,0,0.5);
      --fg-25: rgba(0,0,0,0.25);
      --fg-20: rgba(0,0,0,0.2);
      --fg-08: rgba(0,0,0,0.08);
    }
    body.dark {
      --bg: #000;
      --fg: #fff;
      --fg-90: rgba(255,255,255,0.9);
      --fg-50: rgba(255,255,255,0.5);
      --fg-25: rgba(255,255,255,0.25);
      --fg-20: rgba(255,255,255,0.2);
      --fg-08: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #site-header {
      width: 100%;
      max-width: 100%;
      padding: 14px 32px;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--fg-10);
    }
    #site-header .header-left {
      display: flex;
      align-items: center;
      font-size: 20px;
      font-weight: 500;
      white-space: nowrap;
    }
    #site-header .header-left .current-page::after {
      content: '';
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 2px;
      vertical-align: -0.14em;
      background: currentColor;
    }
    #site-header .header-left .current-page {
      color: var(--fg-90);
    }
    #site-header .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }
    #site-header .header-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--fg-50);
      cursor: pointer;
      padding: 0;
      text-transform: none;
      letter-spacing: 0;
      font-size: inherit;
    }
    #site-header .header-icon:hover {
      color: var(--fg-90);
      background: var(--fg-08);
    }
    #site-header .header-icon svg {
      width: 20px;
      height: 20px;
    }
    #workspace-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) repeat(3, minmax(0, 1fr));
      gap: 32px;
      width: 100%;
      box-sizing: border-box;
      padding: 16px 32px 40px 32px;
      align-items: start;
    }
    #ui-column {
      grid-column: 1 / 2;
      position: sticky;
      top: 68px;
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 260px;
      width: 100%;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--fg-20) transparent;
      padding-right: 6px;
    }
    #typography-column {
      grid-column: 2 / 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
      width: 100%;
      min-height: calc(100vh - 100px);
      cursor: text;
      overflow-x: hidden;
    }
    canvas {
      display: block;
      cursor: text;
      outline: none;
      max-width: 100%;
      min-height: 300px;
    }
    #canvas {
      min-height: 0;
      height: auto !important;
    }
    #controls {
      width: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: stretch;
      padding: 0;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
      width: 100%;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .slider-group label {
      font-size: 14px;
      opacity: 0.45;
      text-transform: none;
      font-variant-caps: all-small-caps;
      letter-spacing: 0.08em;
    }
    .slider-group input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: var(--fg-20);
      border-radius: 1px;
      outline: none;
    }
    .slider-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--fg);
      cursor: pointer;
    }
    .slider-group select {
      background: transparent;
      border: 1px solid var(--fg-25);
      color: var(--fg-70);
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 4px;
      letter-spacing: 0.04em;
      width: 100%;
      outline: none;
    }
    .slider-group select:focus {
      border-color: var(--fg-50);
      color: var(--fg);
    }
    .slider-group select option {
      background: var(--bg);
      color: var(--fg);
    }
    .slider-val {
      font-size: 11px;
      opacity: 0.45;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    #kerning-val, #volume-val, #polyphony-val, #layer-mode-val, #active-layer-val, #layer-val, #gradation-val {
      min-width: 86px;
    }
    .controls-btn-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      width: 100%;
    }
    .controls-btn-grid button {
      width: 100%;
      text-align: center;
      padding: 7px 8px;
      font-size: 13px;
      white-space: normal;
      min-width: 0;
    }
    .sound-btn-wrap {
      grid-column: 1 / -1;
      position: relative;
      width: 100%;
    }
    .sound-btn-wrap button {
      width: 100%;
    }
    button {
      background: transparent;
      border: 1px solid var(--fg-25);
      color: var(--fg-50);
      padding: 6px 12px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: none;
      font-variant-caps: all-small-caps;
      letter-spacing: 0.08em;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover {
      border-color: var(--fg-50);
      color: var(--fg-90);
    }
    button.active {
      border-color: var(--fg-50);
      color: var(--fg);
    }
    #hiddenInput {
      position: fixed;
      top: -100px;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      font-size: 16px;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
    }
    #layer-tabs-bar {
      display: none;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--fg-08);
      border: 1px solid var(--fg-20);
      font-size: 11px;
      font-family: 'Inter', system-ui, sans-serif;
      user-select: none;
      width: 100%;
      max-width: 680px;
      box-sizing: border-box;
    }
    .layer-bar-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      opacity: 0.5;
      text-transform: none;
      font-variant-caps: all-small-caps;
      white-space: nowrap;
    }
    #layer-tabs-container {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .layer-tab-btn {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.04em;
      border: 1px solid var(--fg-25);
      background: transparent;
      color: var(--fg-50);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s ease;
      text-transform: none;
    }
    .layer-tab-btn:hover {
      border-color: var(--fg-50);
      color: var(--fg-90);
    }
    .layer-tab-btn.active {
      border-color: #ff3333;
      background: rgba(255, 51, 51, 0.12);
      color: var(--fg);
      font-weight: 500;
      box-shadow: 0 0 10px rgba(255, 51, 51, 0.2);
    }
    .layer-tab-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--fg-25);
      display: inline-block;
    }
    .layer-tab-btn.active .layer-tab-dot {
      background: #ff3333;
      box-shadow: 0 0 6px #ff3333;
    }
    .layer-bar-hint {
      margin-left: auto;
      font-size: 10px;
      opacity: 0.45;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    @media (max-width: 900px) {
      #workspace-grid {
        grid-template-columns: minmax(220px, 1fr) repeat(3, minmax(0, 1fr));
        gap: 20px;
        padding: 14px 18px;
      }
      #site-header { padding-left: 18px; padding-right: 18px; }
      #ui-column {
        min-width: 220px;
        top: 60px;
        max-height: calc(100vh - 70px);
      }
    }
    @media (max-width: 600px) {
      #site-header { padding: 10px 14px; }
      #site-header .header-left { font-size: 14px; gap: 5px; }
      #site-header .header-icon { width: 32px; height: 32px; }
      #workspace-grid {
        grid-template-columns: minmax(180px, 1fr) repeat(3, minmax(0, 1fr));
        padding: 10px 14px;
        gap: 14px;
      }
      #ui-column {
        min-width: 180px;
        top: 54px;
        max-height: calc(100vh - 62px);
      }
    }

    /* 2D Sound Matrix Panel */
    #soundMatrixPanel {
      width: 100%;
      box-sizing: border-box;
      padding: 0;
      margin: 0;
      display: none;
    }
    #soundMatrixPanel.visible {
      display: block;
    }
    .matrix-box {
      border: 1px solid var(--fg-20);
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--fg-08);
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
    }
    .matrix-header {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .matrix-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: none;
      font-variant-caps: all-small-caps;
      color: var(--fg-90);
    }
    .matrix-readouts {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .m-badge {
      font-size: 9px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 2px 5px;
      border-radius: 3px;
      background: var(--bg);
      border: 1px solid var(--fg-20);
      color: var(--fg-90);
      letter-spacing: 0.02em;
    }
    .matrix-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .m-preset-btn {
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid var(--fg-25);
      background: transparent;
      color: var(--fg-70);
      cursor: pointer;
      text-transform: none;
      font-variant-caps: all-small-caps;
      letter-spacing: 0.05em;
      transition: all 0.15s ease;
    }
    .m-preset-btn:hover {
      border-color: var(--fg-50);
      color: var(--fg);
      background: var(--fg-08);
    }
    .m-preset-btn.active {
      border-color: #ff3333;
      color: #ff3333;
      background: var(--fg-08);
    }
    .matrix-canvas-wrap {
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }
    #matrixCanvas {
      width: 100%;
      height: 160px;
      display: block;
      border: 1px solid var(--fg-20);
      border-radius: 6px;
      background: var(--bg);
      cursor: crosshair;
      touch-action: none;
    }
    .matrix-axis-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--fg-50);
      letter-spacing: 0.05em;
      margin-top: 4px;
      text-transform: none;
      font-variant-caps: all-small-caps;
    }

    /* Mobile Patatap-style grid */
    #mobileUI {
      display: none;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }
    #mobileUI.visible { display: flex; }

    #mobileCanvas {
      display: block;
      width: 100%;
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
    }

    #mobileUI { background: var(--bg); }
    #letterGrid {
      flex: 0 0 auto;
      max-height: 30vh;
      display: none;
      flex-direction: column;
      gap: 3px;
      padding: 4px 4px;
      background: var(--fg-08);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #letterGrid.visible {
      display: flex;
    }
    .kb-row {
      display: flex;
      flex: 1;
      gap: 3px;
      justify-content: center;
    }
    .grid-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--fg-08);
      color: var(--fg-50);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      border-radius: 5px;
      flex: 1;
      max-width: 36px;
      transition: background 0.08s, color 0.08s;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .grid-cell:active, .grid-cell.flash {
      background: var(--fg-90);
      color: var(--bg);
    }
    .grid-cell.wide {
      flex: 1.4;
      max-width: 52px;
      font-size: 11px;
    }
    .grid-cell.space {
      flex: 5;
      max-width: none;
      font-size: 11px;
      color: var(--fg-25);
      letter-spacing: 0.1em;
    }
    .grid-cell.fn {
      font-size: 11px;
      color: var(--fg-50);
      letter-spacing: 0;
    }
    .grid-cell.fn:active, .grid-cell.fn.flash {
      background: rgba(255,100,100,0.6);
      color: #fff;
    }
    .grid-cell .ripple {
      position: absolute;
      border-radius: 50%;
      background: var(--fg-25);
      transform: scale(0);
      animation: rippleAnim 0.4s ease-out forwards;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(2.5); opacity: 0; }
    }

    #mobileToolbar {
      display: flex;
      height: 36px;
      flex: 0 0 36px;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      background: var(--fg-08);
      border-top: 1px solid var(--fg-08);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #mobileToolbar::-webkit-scrollbar {
      display: none;
    }
    #mobileToolbar button {
      border: none;
      padding: 4px 6px;
      font-size: 9px;
      letter-spacing: 0.02em;
      color: var(--fg-50);
      background: transparent;
      white-space: nowrap;
      flex: 1;
      min-width: 50px;
    }
    @keyframes mSoundBlink {
      0%, 100% { color: #e53935; }
      50% { color: var(--fg-50); }
    }
    #mSound.blink {
      animation: mSoundBlink 1s ease-in-out infinite;
    }
    #sound-hint {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--fg);
      color: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      z-index: 200;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #sound-hint::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--fg);
    }
    #sound-hint.show { opacity: 1; pointer-events: auto; }
    #sound-hint svg { flex-shrink: 0; }
  </style>
</head>
<body>
  <header id="site-header">
    <div class="header-left">
      <span class="current-page">sonitype</span>
    </div>
    <div class="header-right">
    </div>
  </header>
  <script>
    (function () {
      const el = document.querySelector('#site-header .current-page');
      if (!el) return;
      const text = el.textContent;
      el.textContent = '';
      function typeLoop() {
        let i = 0;
        el.textContent = '';
        (function typeNext() {
          if (i > text.length) { setTimeout(typeLoop, 4000); return; }
          el.textContent = text.slice(0, i++);
          setTimeout(typeNext, i === 1 ? 400 : 90 + Math.random() * 90);
        })();
      }
      typeLoop();
    })();
  </script>
  <input id="hiddenInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="Text input" />

  <div id="workspace-grid">
    <aside id="ui-column">
      <div id="controls">
        <div class="slider-group">
          <div class="slider-header">
            <label>Tone</label>
          </div>
          <select id="fontSelect" aria-label="Tone">
            <option value="inter" selected>Electric</option>
            <option value="roboto-slab">Ambient</option>
            <option value="space-grotesk">Alphabet</option>
          </select>
        </div>
        <div class="slider-group">
          <div class="slider-header">
            <label>Polyphony</label>
            <span class="slider-val" id="polyphony-val">OFF</span>
          </div>
          <select id="polyphonySelect" aria-label="Polyphony">
            <option value="off" selected>OFF</option>
            <option value="ambient-electric">Ambient + Electric</option>
            <option value="ambient-alphabet">Ambient + Alphabet</option>
            <option value="electric-alphabet">Electric + Alphabet</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="slider-group" id="secondaryFontGroup" style="display: none;">
          <div class="slider-header">
            <label>Secondary Tone</label>
          </div>
          <select id="secondaryFontSelect" aria-label="Secondary Tone">
            <option value="roboto-slab" selected>Ambient</option>
            <option value="inter">Electric</option>
            <option value="space-grotesk">Alphabet</option>
          </select>
        </div>
        <div class="slider-group">
          <div class="slider-header">
            <label>Layer Mode</label>
            <span class="slider-val" id="layer-mode-val">Single</span>
          </div>
          <select id="layerModeSelect" aria-label="Layer Mode">
            <option value="single" selected>Single Layer</option>
            <option value="double">Double Layer</option>
            <option value="blended">Blended</option>
          </select>
        </div>
        <div class="slider-group">
          <div class="slider-header">
            <label>Ambient Gradation</label>
            <span class="slider-val" id="gradation-val">OFF</span>
          </div>
          <select id="gradationSelect" aria-label="Ambient Gradation">
            <option value="off" selected>OFF</option>
            <option value="energy">Energy Wave</option>
            <option value="frequency">Frequency Bands</option>
            <option value="spectrum">Full Spectrum</option>
          </select>
        </div>
        <div class="slider-group" id="readingSpeedGroup" style="display: none;">
          <div class="slider-header">
            <label>Reading Speed</label>
            <span class="slider-val" id="reading-speed-val">1.0x</span>
          </div>
          <input type="range" id="readingSpeedSlider" min="0.5" max="2.0" step="0.1" value="1.0" aria-label="Reading Speed" />
        </div>
        <div class="slider-group" id="activeLayerGroup">
          <div class="slider-header">
            <label>Active Input Layer</label>
            <span class="slider-val" id="active-layer-val">Inter</span>
          </div>
          <select id="activeLayerSelect" aria-label="Active Layer">
            <option value="inter" selected>Electric</option>
            <option value="roboto-slab">Ambient</option>
            <option value="space-grotesk">Alphabet</option>
          </select>
        </div>
        <div class="slider-group">
          <div class="slider-header">
            <label>Speed</label>
            <span class="slider-val" id="kerning-val">138 BPM</span>
          </div>
          <input type="range" id="kerningSlider" min="-20" max="25" value="-4" aria-label="Speed" />
        </div>
        <div class="slider-group">
          <div class="slider-header">
            <label>Frequency</label>
            <span class="slider-val" id="freq-val">1.00x</span>
          </div>
          <input type="range" id="freqSlider" min="-12" max="12" value="0" step="1" aria-label="Frequency" />
        </div>
        <div class="slider-group">
          <div class="slider-header">
            <label>Wave</label>
            <span class="slider-val" id="wave-val">200</span>
          </div>
          <input type="range" id="waveSlider" min="0" max="200" value="200" aria-label="Wave Intensity" />
        </div>
        <div class="slider-group">
          <div class="slider-header">
            <label>Volume</label>
            <span class="slider-val" id="volume-val">80%</span>
          </div>

              <button class="m-preset-btn" data-preset="balanced">Default</button>
              <button class="m-preset-btn" data-preset="glitch">Glitch</button>
              <button class="m-preset-btn active" data-preset="sub">Sub</button>
              <button class="m-preset-btn" data-preset="fm">FM Ping</button>
              <button class="m-preset-btn" data-preset="metallic">Metallic</button>

          <div class="matrix-canvas-wrap">
            <canvas id="matrixCanvas" width="480" height="180"></canvas>
            <div class="matrix-axis-labels">
              <span class="matrix-axis-x">← SUB / LOW &nbsp; &nbsp; HI / TIMBRE →</span>
              <span class="matrix-axis-y">↑ RES / FM</span>

    <main id="typography-column">
      <div id="layer-tabs-bar">
        <span class="layer-bar-title">LAYER:</span>
        <div id="layer-tabs-container"></div>
        <span class="layer-bar-hint">[Tab] switch layer</span>

  <div id="mobileUI">
    <canvas id="mobileCanvas"></canvas>
    <div id="letterGrid"></div>
    <div id="mobileToolbar">
      <button id="mClear">CLEAR</button>
      <button id="mFont">TONE: ELECTRIC</button>
      <button id="mSound">SOUND: OFF</button>
      <button id="mPolyphony">POLY: OFF</button>
      <button id="mLayer">LAYER: SINGLE</button>
      <button id="mGradation">GRAD: OFF</button>
      <button id="mMetrics">METRICS: ON</button>
      <button id="mClock">CLOCK: OFF</button>
      <button id="mRepeat" class="active">REPEAT: STOP</button>
      <button id="mFill" class="active">FILL: ON</button>
      <button id="mMatrix">SOUND: MATRIX</button>
      <button id="mSpeed">SPEED: MED</button>
      <button id="mWave">WAVE: 200</button>
      <button id="mVol">VOL: 80%</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hiddenInput = document.getElementById('hiddenInput');
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speed-val');
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth < 900);
    const fillToggle = document.getElementById('fillToggle');
    const kerningToggle = document.getElementById('kerningToggle');
    const sizeToggle = document.getElementById('sizeToggle');
    const kerningSlider = document.getElementById('kerningSlider');
    const kerningVal = document.getElementById('kerning-val');
    const fontSelect = document.getElementById('fontSelect');
    const waveSlider = document.getElementById('waveSlider');
    const waveValEl = document.getElementById('wave-val');
    let waveIntensity = 200;
    const fadeToggle = document.getElementById('fadeToggle');
    const soundToggle = document.getElementById('soundToggle');
    const themeBtn = document.getElementById('themeBtn');

    let isDark = false;
    var animFrameId = null;
    const sunSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
    const moonSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
    if (themeBtn) themeBtn.innerHTML = sunSVG;
    if (themeBtn) themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      document.body.classList.toggle('dark', isDark);
      themeBtn.innerHTML = isDark ? sunSVG : moonSVG;
      if (typeof drawMatrixCanvas === 'function') drawMatrixCanvas();
      scheduleFrame();
    });

    let showFill = true;
    let mShowFill = true;
    let kerningEnabled = true;
    let sizeEnabled = true;
    let fadeEnabled = true;
    let soundEnabled = true;
    let polyphonyMode = 'off';
    let secondaryFontKey = 'roboto-slab';
    let layerMode = 'single';
    let clockMode = false;
    let clockTimer = null;
    let lastClockTime = '';
    let gradationMode = 'off';
    let showMetrics = true;
    let kerningMode = 'combined';

    function updateFillState(active) {
      showFill = !!active;
      if (typeof mShowFill !== 'undefined') mShowFill = showFill;
      if (fillToggle) {
        fillToggle.textContent = showFill ? 'Fill: ON' : 'Fill: OFF';
        fillToggle.classList.toggle('active', showFill);
      }
      const mBtn = document.getElementById('mFill');
      if (mBtn) {
        mBtn.textContent = showFill ? 'FILL: ON' : 'FILL: OFF';
        mBtn.classList.toggle('active', showFill);
      }
    }
    updateFillState(true);

    const FADE_DURATION = 3000;

    fillToggle.addEventListener('click', () => {
      updateFillState(!showFill);
      canvas.focus();
      scheduleFrame();
      if (typeof mScheduleRef === 'function') mScheduleRef();
    });

    let colorPalette = 'red-black'; // 'red-black' | 'mono' | 'rainbow'
    const PALETTE_LABELS = {
      'mono': 'Black and White',
      'rainbow': 'Rainbow',
      'red-black': 'Red → Black'
    };
    const M_PALETTE_LABELS = {
      'mono': 'PAL: B&W',
      'rainbow': 'PAL: RAINBOW',
      'red-black': 'PAL: RED'
    };
    const PALETTE_KEYS = ['mono', 'rainbow', 'red-black'];

    function getFontDisplayName(key) {
      switch (key) {
        case 'inter': return 'Inter';
        case 'roboto-slab': return 'Roboto Slab';
        case 'space-grotesk': return 'Space Grotesk';
        case 'playfair-display': return 'Playfair Display';
        case 'reading': return 'Reading';
        case 'morse': return 'Morse';
        default: return key;
      }
    }

    function getPolyphonyTypes() {
      switch (polyphonyMode) {
        case 'ambient-electric':
          return ['roboto-slab', 'inter'];
        case 'ambient-alphabet':
          return ['roboto-slab', 'space-grotesk'];
        case 'electric-alphabet':
          return ['inter', 'space-grotesk'];
        case 'custom':
          return [getActiveFontKey(), secondaryFontKey || 'roboto-slab'];
        default:
          return [activeLayer || getActiveFontKey()];
      }
    }

    function getActivePolyphonyLayers() {
      if (polyphonyMode === 'off') {
        return [activeLayer || getActiveFontKey()];
      }
      return getPolyphonyTypes();
    }

    // Layer selection for multi-layer polyphony
    const activeLayerSelect = document.getElementById('activeLayerSelect');
    const activeLayerVal = document.getElementById('active-layer-val');
    
    function updateActiveLayer(newLayer) {
      if (!layerTextData[newLayer]) return;
      if (activeLayer === newLayer) return;
      
      // Save outgoing layer cursor
      updateLayerCursor(activeLayer, cursorLine, cursorCol);
      
      activeLayer = newLayer;
      
      // Sync incoming layer cursor
      syncActiveLayerCursor();
      // Use the synced cursor position instead of checking old cursorLine
      const synced = layerCursors[activeLayer] || { line: 0, col: 0 };
      cursorLine = synced.line;
      cursorCol = synced.col;
      const activeText = layerTextData[activeLayer] || [[]];
      if (!activeText[cursorLine]) cursorLine = 0;
      if (!activeText[cursorLine]) activeText[0] = [];
      cursorCol = Math.min(cursorCol, activeText[cursorLine].length);
      updateLayerCursor(activeLayer, cursorLine, cursorCol);
      
      if (fontCache[activeLayer]) {
        font = fontCache[activeLayer];
      }
      
      // If polyphony is off, keep fontSelect aligned
      if (polyphonyMode === 'off' && fontSelect && fontSelect.value !== newLayer) {
        fontSelect.value = newLayer;
        if (typeof loadFont === 'function') loadFont(false);
      }
      
      if (activeLayerSelect && activeLayerSelect.value !== newLayer) {
        activeLayerSelect.value = newLayer;
      }
      if (activeLayerVal) {
        activeLayerVal.textContent = getSoundTypeName(newLayer);
      }
      
      renderLayerTabs();
      updateSoundToggleUI();
      resetBlink();
      scheduleFrame();
    }
    
    if (activeLayerSelect) {
      activeLayerSelect.addEventListener('change', (e) => {
        updateActiveLayer(e.target.value);
        canvas.focus();
      });
    }

    function updateActiveLayerSelectOptions() {
      if (!activeLayerSelect) return;
      const polyLayers = getActivePolyphonyLayers();
      activeLayerSelect.innerHTML = '';
      polyLayers.forEach((layerKey, idx) => {
        const opt = document.createElement('option');
        opt.value = layerKey;
        const typeName = getSoundTypeName(layerKey);
        const fontName = getFontDisplayName(layerKey);
        opt.textContent = `Layer ${idx + 1}: ${typeName}`;
        activeLayerSelect.appendChild(opt);
      });
      activeLayerSelect.value = activeLayer;
      if (activeLayerVal) {
        activeLayerVal.textContent = getSoundTypeName(activeLayer);
      }
      const grp = document.getElementById('activeLayerGroup');
      if (grp) {
        grp.style.display = (polyphonyMode !== 'off') ? 'flex' : 'none';
      }
    }

    function renderLayerTabs() {
      const bar = document.getElementById('layer-tabs-bar');
      const container = document.getElementById('layer-tabs-container');
      if (!bar || !container) return;
      
      if (polyphonyMode === 'off') {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      container.innerHTML = '';
      
      const polyLayers = getActivePolyphonyLayers();
      polyLayers.forEach((layerKey, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'layer-tab-btn' + (layerKey === activeLayer ? ' active' : '');
        const typeName = getSoundTypeName(layerKey);
        const fontName = getFontDisplayName(layerKey);
        btn.innerHTML = `<span class="layer-tab-dot"></span><span>Layer ${idx + 1}: ${typeName}</span>`;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          updateActiveLayer(layerKey);
          canvas.focus();
        });
        container.appendChild(btn);
      });
    }

    function updatePalette(newPalette, schedule = true) {
      if (!PALETTE_KEYS.includes(newPalette)) return;
      colorPalette = newPalette;
      const sel = document.getElementById('paletteSelect');
      if (sel && sel.value !== colorPalette) sel.value = colorPalette;
      const valEl = document.getElementById('palette-val');
      if (valEl) valEl.textContent = PALETTE_LABELS[colorPalette] || colorPalette;
      const mBtn = document.getElementById('mPalette');
      if (mBtn) mBtn.textContent = M_PALETTE_LABELS[colorPalette] || 'PALETTE';
      if (schedule && typeof scheduleFrame === 'function') {
        scheduleFrame();
        if (typeof mScheduleRef === 'function') mScheduleRef();
      }
    }

    const paletteSelect = document.getElementById('paletteSelect');
    if (paletteSelect) {
      paletteSelect.addEventListener('change', (e) => {
        updatePalette(e.target.value, true);
        canvas.focus();
      });
    }
    updatePalette(colorPalette, false);

    // Polyphony controls
    const polyphonySelect = document.getElementById('polyphonySelect');
    const secondaryFontGroup = document.getElementById('secondaryFontGroup');
    const secondaryFontSelect = document.getElementById('secondaryFontSelect');
    const layerModeSelect = document.getElementById('layerModeSelect');
    const polyphonyVal = document.getElementById('polyphony-val');
    const layerModeVal = document.getElementById('layer-mode-val');

    window.updatePolyphonyUI = function() {
      if (polyphonySelect) {
        polyphonySelect.value = polyphonyMode;
        if (polyphonyVal) {
          polyphonyVal.textContent = polyphonyMode === 'off' ? 'OFF' : polyphonyMode.toUpperCase().replace('-', ' + ');
        }
        if (secondaryFontGroup) {
          secondaryFontGroup.style.display = polyphonyMode === 'custom' ? 'block' : 'none';
        }
      }
    };

    window.updateLayerUI = function() {
      if (layerModeSelect) {
        layerModeSelect.value = layerMode;
        if (layerModeVal) {
          layerModeVal.textContent = layerMode === 'single' ? 'Single' : layerMode === 'double' ? 'Double' : 'Blended';
        }
      }
    };

    if (polyphonySelect) {
      polyphonySelect.addEventListener('change', (e) => {
        polyphonyMode = e.target.value;
        if (polyphonyMode !== 'custom') {
          // Auto-set secondary font based on polyphony mode
          const modes = {
            'ambient-electric': 'roboto-slab',
            'ambient-alphabet': 'roboto-slab',
            'electric-alphabet': 'inter'
          };
          secondaryFontKey = modes[polyphonyMode] || 'roboto-slab';
          if (secondaryFontSelect) secondaryFontSelect.value = secondaryFontKey;
        }
        if (polyphonyMode !== 'off' && layerMode === 'single') {
          layerMode = 'blended';
          window.updateLayerUI();
        }
        const polyLayers = getActivePolyphonyLayers();
        if (!polyLayers.includes(activeLayer)) {
          updateActiveLayer(polyLayers[0]);
        }
        window.updatePolyphonyUI();
        updateActiveLayerSelectOptions();
        renderLayerTabs();
        // Reload fonts when polyphony mode changes
        loadFont(false).then(() => {
          canvas.focus();
          scheduleFrame();
        });
      });
    }

    if (secondaryFontSelect) {
      secondaryFontSelect.addEventListener('change', (e) => {
        secondaryFontKey = e.target.value;
        updateActiveLayerSelectOptions();
        renderLayerTabs();
        loadFont(false).then(() => {
          canvas.focus();
          scheduleFrame();
        });
      });
    }

    if (layerModeSelect) {
      layerModeSelect.addEventListener('change', (e) => {
        layerMode = e.target.value;
        window.updateLayerUI();
        canvas.focus();
        scheduleFrame();
      });
    }

    window.updatePolyphonyUI();
    window.updateLayerUI();

    // Ambient gradation controls
    const gradationSelect = document.getElementById('gradationSelect');
    const gradationVal = document.getElementById('gradation-val');

    window.updateGradationUI = function() {
      if (gradationSelect) {
        gradationSelect.value = gradationMode;
        if (gradationVal) {
          gradationVal.textContent = gradationMode === 'off' ? 'OFF' : gradationMode.toUpperCase();
        }
      }
    };

    function getGradationColor(charObj, progress, fadeT, isDeleting, showFill, isDark, fg) {
      if (gradationMode === 'off') {
        return getGlyphFillColor(charObj, progress, fadeT, isDeleting, showFill, isDark, fg);
      }

      const e = audioEnergy;
      const bands = audioBands;

      if (gradationMode === 'energy') {
        // Energy wave: red/orange gradient based on audio energy
        const energy = Math.min(1, e * 2);
        if (isDark) {
          const r = Math.floor(255 * energy);
          const g = Math.floor(50 + 100 * (1 - energy));
          const b = Math.floor(50 + 50 * (1 - energy));
          return `rgba(${r}, ${g}, ${b}, ${0.8 * (1 - fadeT)})`;
        } else {
          const r = Math.floor(200 + 55 * energy);
          const g = Math.floor(50 * (1 - energy));
          const b = Math.floor(50 * (1 - energy));
          return `rgba(${r}, ${g}, ${b}, ${0.8 * (1 - fadeT)})`;
        }
      }

      if (gradationMode === 'frequency') {
        // Frequency bands: map 4 frequency bands to colors
        const bandIndex = charObj ? (charObj.id % 4) : 0;
        const bandEnergy = bands[bandIndex] || 0;
        const bandBoost = Math.min(1, bandEnergy * 3);

        const colors = [
          [255, 100, 100], // Red (low freq)
          [100, 255, 100], // Green (mid-low)
          [100, 100, 255], // Blue (mid-high)
          [255, 255, 100]  // Yellow (high freq)
        ];

        const [r, g, b] = colors[bandIndex];
        const boost = 1 + bandBoost * 0.5;
        return `rgba(${Math.min(255, r * boost)}, ${Math.min(255, g * boost)}, ${Math.min(255, b * boost)}, ${0.7 * (1 - fadeT)})`;
      }

      if (gradationMode === 'spectrum') {
        // Full spectrum: rainbow based on character position and audio
        const hue = getCharHue(charObj);
        const saturation = 70 + (e * 30);
        const lightness = isDark ? 50 + (e * 20) : 40 + (e * 20);
        return `hsla(${hue}, ${saturation}%, ${lightness}%, ${0.8 * (1 - fadeT)})`;
      }

      return getGlyphFillColor(charObj, progress, fadeT, isDeleting, showFill, isDark, fg);
    }

    if (gradationSelect) {
      gradationSelect.addEventListener('change', (e) => {
        gradationMode = e.target.value;
        window.updateGradationUI();
        canvas.focus();
        scheduleFrame();
      });
    }

    window.updateGradationUI();

    // Reading speed control
    const readingSpeedSlider = document.getElementById('readingSpeedSlider');
    const readingSpeedVal = document.getElementById('reading-speed-val');
    const readingSpeedGroup = document.getElementById('readingSpeedGroup');
    let readingSpeed = 1.0;

    function updateReadingSpeedUI() {
      if (readingSpeedSlider) {
        readingSpeedSlider.value = readingSpeed;
      }
      if (readingSpeedVal) {
        readingSpeedVal.textContent = readingSpeed.toFixed(1) + 'x';
      }
      // Show reading speed group only when reading font is selected
      if (readingSpeedGroup) {
        const isReadingFont = getActiveFontKey() === 'reading';
        readingSpeedGroup.style.display = isReadingFont ? 'block' : 'none';
      }
    }

    if (readingSpeedSlider) {
      readingSpeedSlider.addEventListener('input', (e) => {
        readingSpeed = parseFloat(e.target.value);
        updateReadingSpeedUI();
      });
    }

    updateReadingSpeedUI();

    if (kerningToggle) kerningToggle.addEventListener('click', () => {
      kerningEnabled = !kerningEnabled;
      kerningToggle.textContent = kerningEnabled ? 'Kerning: ON' : 'Kerning: OFF';
      kerningToggle.classList.toggle('active', kerningEnabled);
      canvas.focus();
      scheduleFrame();
    });

    if (sizeToggle) sizeToggle.addEventListener('click', () => {
      sizeEnabled = !sizeEnabled;
      sizeToggle.textContent = sizeEnabled ? 'Size: ON' : 'Size: OFF';
      sizeToggle.classList.toggle('active', sizeEnabled);
      canvas.focus();
      scheduleFrame();
    });

    fadeToggle.addEventListener('click', () => {
      fadeEnabled = !fadeEnabled;
      fadeToggle.textContent = fadeEnabled ? 'Fade: ON' : 'Fade: OFF';
      fadeToggle.classList.toggle('active', fadeEnabled);
      canvas.focus();
      scheduleFrame();
    });

    let cameraFollow = true;
    function updateCameraFollowState(state) {
      cameraFollow = state;
      const btn = document.getElementById('cameraToggle');
      if (btn) {
        btn.textContent = cameraFollow ? 'Camera: Scroll ON' : 'Camera: Scroll OFF';
        btn.classList.toggle('active', cameraFollow);
      }
      const mBtn = document.getElementById('mCamera');
      if (mBtn) {
        mBtn.textContent = cameraFollow ? 'CAM: ON' : 'CAM: OFF';
        mBtn.classList.toggle('active', cameraFollow);
      }
      if (cameraFollow && typeof scrollCameraToPlayback === 'function') {
        scrollCameraToPlayback(true);
      }
    }

    const cameraToggle = document.getElementById('cameraToggle');
    if (cameraToggle) {
      cameraToggle.addEventListener('click', () => {
        updateCameraFollowState(!cameraFollow);
        canvas.focus();
      });
    }

    // Clock mode toggle
    const clockToggle = document.getElementById('clockToggle');
    if (clockToggle) {
      clockToggle.addEventListener('click', () => {
        clockMode = !clockMode;
        clockToggle.textContent = clockMode ? 'Clock: ON' : 'Clock: OFF';
        clockToggle.classList.toggle('active', clockMode);

        if (clockMode) {
          // Clear existing text and start clock
          dMsgStop();
          stopAutoplay();
          layerTextData[activeLayer] = [[]];
          cursorLine = 0;
          cursorCol = 0;
          lastClockTime = '';
          window.updateClockDisplay();
          clockTimer = setInterval(window.updateClockDisplay, 1000);
        } else {
          // Stop clock and restore normal mode
          clearInterval(clockTimer);
          clockTimer = null;
          layerTextData[activeLayer] = [[]];
          cursorLine = 0;
          cursorCol = 0;
        }
        canvas.focus();
        if (typeof scheduleFrame === 'function') scheduleFrame();
      });
    }

    // Metrics toggle
    const metricsToggle = document.getElementById('metricsToggle');
    if (metricsToggle) {
      metricsToggle.classList.add('active'); // Start with active since showMetrics = true
      metricsToggle.addEventListener('click', () => {
        showMetrics = !showMetrics;
        metricsToggle.textContent = showMetrics ? 'Metrics: ON' : 'Metrics: OFF';
        metricsToggle.classList.toggle('active', showMetrics);
        canvas.focus();
        if (typeof scheduleFrame === 'function') scheduleFrame();
      });
    }

    // Kerning mode controls
    const kerningModeSelect = document.getElementById('kerningModeSelect');
    const kerningModeVal = document.getElementById('kerning-mode-val');

    function updateKerningModeUI() {
      if (kerningModeSelect) {
        kerningModeSelect.value = kerningMode;
      }
      if (kerningModeVal) {
        kerningModeVal.textContent = kerningMode === 'manual' ? 'Manual' : kerningMode === 'optical' ? 'Optical' : 'Combined';
      }
    }

    if (kerningModeSelect) {
      kerningModeSelect.addEventListener('change', (e) => {
        kerningMode = e.target.value;
        updateKerningModeUI();
        canvas.focus();
        scheduleFrame();
      });
    }

    updateKerningModeUI();

    // Optical kerning pairs for better visual appearance
    const OPTICAL_KERNING_PAIRS = {
      // Common problematic pairs
      'AV': -8, 'VA': -6, 'AW': -7, 'WA': -5,
      'AT': -7, 'TA': -5, 'AY': -8, 'YA': -6,
      'AV': -8, 'VA': -6, 'AW': -7, 'WA': -5,
      'To': -5, 'Te': -4, 'Tr': -5, 'Ty': -6,
      'Wo': -4, 'We': -3, 'Wr': -4, 'Wy': -5,
      'Vo': -5, 'Ve': -4, 'Vr': -5, 'Vy': -6,
      'Yo': -4, 'Ye': -3, 'Yr': -4, 'Yy': -5,
      'Po': -3, 'Pe': -2, 'Pr': -3, 'Py': -4,
      'Fo': -3, 'Fe': -2, 'Fr': -3, 'Fy': -4,
      'LT': -4, 'LY': -5, 'LT': -4, 'LY': -5,
      'RT': -4, 'RY': -5, 'RT': -4, 'RY': -5,
      'Qu': -4, 'Qo': -3, 'Qe': -2,
      'Gu': -3, 'Go': -2, 'Ge': -1,
      'Th': -2, 'Ti': -1, 'To': -2,
      'Wh': -2, 'Wi': -1, 'Wo': -2,
      'Sh': -2, 'Si': -1, 'So': -2,
      'Ch': -2, 'Ci': -1, 'Co': -2,
      'Ph': -2, 'Pi': -1, 'Po': -2,
      'Kn': -2, 'Ki': -1, 'Ko': -2,
      'Wr': -3, 'Wi': -2, 'Wo': -3,

    function getOpticalKerning(prevChar, currentChar) {
      if (!prevChar || !currentChar) return 0;
      const pair = (prevChar + currentChar).toUpperCase();
      return OPTICAL_KERNING_PAIRS[pair] || 0;
    }

    function getEffectiveKerning(prevChar, currentChar, baseKerning) {
      if (kerningMode === 'manual') {
        return baseKerning;
      }
      if (kerningMode === 'optical') {
        return getOpticalKerning(prevChar, currentChar);
      }
      if (kerningMode === 'combined') {
        const optical = getOpticalKerning(prevChar, currentChar);
        return baseKerning + optical;
      }
      return baseKerning;
    }

    window.getClockTime = function() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      return `${hours}${minutes}${seconds}`; // Remove colons
    };

    window.updateClockDisplay = function() {
      if (!clockMode) return;

      const currentTime = window.getClockTime();

      if (currentTime !== lastClockTime) {
        // Clear previous display
        layerTextData[activeLayer] = [[], [], []]; // 3 lines for hours, minutes, seconds
        cursorLine = 0;
        cursorCol = 0;

        // Split time into groups: HH, MM, SS
        const hours = currentTime.substring(0, 2);
        const minutes = currentTime.substring(2, 4);
        const seconds = currentTime.substring(4, 6);

        const timeGroups = [hours, minutes, seconds];

        // Display each group on separate line
        timeGroups.forEach((group, lineIndex) => {
          const groupChars = group.split('');
          groupChars.forEach((char, charIndex) => {
            setTimeout(() => {
              const newChar = initCharObj({
                char: char,
                id: charIdCounter++,
                done: false,
                kerning: 0,
                fontSize: FONT_SIZE * 2.0 // Even larger for multi-line display
              });
              layerTextData[activeLayer][lineIndex].push(newChar);

              // Play sound for each character
              if (soundEnabled) {
                pronounceChar(char, false, newChar.fontType, newChar, { source: 'clock' });
              }

              // Animate character
              if (window.startAnimation) window.startAnimation(newChar);
              triggerCharFlash(newChar);
              if (typeof scheduleFrame === 'function') scheduleFrame();
            }, (lineIndex * 200) + (charIndex * 80)); // Stagger by line then by character

    function updateMatrixParams() {
      const avgX = (matrixPoints[0].x + matrixPoints[1].x * 1.5 + matrixPoints[2].x * 1.5 + matrixPoints[3].x) / 5;
      matrixState.freqMul = parseFloat(Math.max(0.35, Math.min(2.8, Math.pow(2, (avgX - 0.48) * 3))).toFixed(2));

      const maxY = Math.max(matrixPoints[1].y, matrixPoints[2].y);
      matrixState.resonanceMul = parseFloat(Math.max(0.2, Math.min(3.2, 0.25 + maxY * 2.75)).toFixed(2));

      const spanX = Math.max(0.1, matrixPoints[3].x - matrixPoints[0].x);
      const spanY = Math.abs(matrixPoints[1].y - matrixPoints[0].y) + Math.abs(matrixPoints[2].y - matrixPoints[3].y);
      const curveFactor = (spanX * 0.7 + spanY * 0.5);
      matrixState.decayMul = parseFloat(Math.max(0.2, Math.min(2.6, 0.25 + curveFactor * 1.7)).toFixed(2));

      const midY = (matrixPoints[1].y + matrixPoints[2].y) / 2;
      const baseMidY = (matrixPoints[0].y + matrixPoints[3].y) / 2;
      const diff = Math.max(0, midY - baseMidY);
      matrixState.drive = Math.min(0.85, Math.max(0, (diff - 0.2) * 1.6));

      const fb = document.getElementById('mFreqBadge');
      if (fb) fb.textContent = 'FREQ: ' + matrixState.freqMul.toFixed(2) + 'x';

    function drawMatrixCanvas() {
      if (!matrixCanvas || !matrixCtx) return;
      const rect = matrixCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const displayW = rect.width || 480;
      const displayH = rect.height || 180;
      if (matrixCanvas.width !== Math.round(displayW * dpr) || matrixCanvas.height !== Math.round(displayH * dpr)) {
        matrixCanvas.width = Math.round(displayW * dpr);
        matrixCanvas.height = Math.round(displayH * dpr);
      }

      const W = displayW;
      const H = displayH;
      matrixCtx.save();
      matrixCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      matrixCtx.clearRect(0, 0, W, H);

      const isD = isDark;
      const bg = isD ? '#0a0a0a' : '#fafafa';
      const gridColor = isD ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.08)';
      const textCol = isD ? 'rgba(255, 255, 255, 0.45)' : 'rgba(0, 0, 0, 0.45)';

      matrixCtx.fillStyle = bg;
      matrixCtx.fillRect(0, 0, W, H);

      const padX = 28, padY = 22;
      const drawW = W - padX * 2;
      const drawH = H - padY * 2;

      // Coordinate Matrix Grid lines
      matrixCtx.lineWidth = 1;
      matrixCtx.strokeStyle = gridColor;
      matrixCtx.setLineDash([2, 3]);

      for (let i = 1; i <= 3; i++) {
        const gx = padX + (drawW * i) / 4;
        matrixCtx.beginPath();
        matrixCtx.moveTo(gx, padY);
        matrixCtx.lineTo(gx, H - padY);
        matrixCtx.stroke();
      }
      for (let i = 1; i <= 3; i++) {
        const gy = padY + (drawH * i) / 4;
        matrixCtx.beginPath();
        matrixCtx.moveTo(padX, gy);
        matrixCtx.lineTo(W - padX, gy);
        matrixCtx.stroke();
      }

      const toPx = (pt) => ({
        x: padX + pt.x * drawW,
        y: (H - padY) - pt.y * drawH
      });

      const p0 = toPx(matrixPoints[0]);
      const p1 = toPx(matrixPoints[1]);
      const p2 = toPx(matrixPoints[2]);
      const p3 = toPx(matrixPoints[3]);

      // Tangents
      matrixCtx.setLineDash([3, 3]);
      matrixCtx.strokeStyle = isD ? 'rgba(255, 255, 255, 0.22)' : 'rgba(0, 0, 0, 0.22)';
      matrixCtx.beginPath();
      matrixCtx.moveTo(p0.x, p0.y);
      matrixCtx.lineTo(p1.x, p1.y);
      matrixCtx.stroke();

      matrixCtx.beginPath();
      matrixCtx.moveTo(p3.x, p3.y);
      matrixCtx.lineTo(p2.x, p2.y);
      matrixCtx.stroke();

      matrixCtx.setLineDash([]);

      // Fill area below curve
      const fillGrad = matrixCtx.createLinearGradient(0, padY, 0, H - padY);
      const pe = matrixState.pulseEnergy || 0;
      if (isD) {
        fillGrad.addColorStop(0, 'rgba(255, 30, 30, ' + (0.15 + pe * 0.25).toFixed(3) + ')');
        fillGrad.addColorStop(1, 'rgba(255, 30, 30, 0.01)');
      } else {
        fillGrad.addColorStop(0, 'rgba(220, 20, 20, ' + (0.12 + pe * 0.2).toFixed(3) + ')');
        fillGrad.addColorStop(1, 'rgba(220, 20, 20, 0.01)');
      }

      matrixCtx.beginPath();
      matrixCtx.moveTo(p0.x, H - padY);
      matrixCtx.lineTo(p0.x, p0.y);
      matrixCtx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
      matrixCtx.lineTo(p3.x, H - padY);
      matrixCtx.closePath();
      matrixCtx.fillStyle = fillGrad;
      matrixCtx.fill();

      // Main Cubic Bezier Curve
      matrixCtx.beginPath();
      matrixCtx.moveTo(p0.x, p0.y);
      matrixCtx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
      matrixCtx.lineWidth = 2.2 + pe * 2;
      matrixCtx.strokeStyle = pe > 0.05 ? 'rgba(255, ' + Math.round(30 + pe * 90) + ', 30, 1)' : '#e53935';
      if (pe > 0.05) {
        matrixCtx.shadowColor = '#ff1744';
        matrixCtx.shadowBlur = 12 * pe;
      }
      matrixCtx.stroke();
      matrixCtx.shadowBlur = 0;

      // Draw vertices / handles
      const pts = [
        { p: p0, label: 'P0: Floor' },
        { p: p1, label: 'P1: Attack' },
        { p: p2, label: 'P2: Res/FM' },
        { p: p3, label: 'P3: Decay' }
      ];

      pts.forEach((pt, idx) => {
        const isHover = activeDragIdx === idx;
        const radius = isHover ? 7 : 5.5;

        if (isHover) {
          matrixCtx.beginPath();
          matrixCtx.arc(pt.p.x, pt.p.y, radius + 4, 0, Math.PI * 2);
          matrixCtx.fillStyle = 'rgba(229, 57, 53, 0.25)';
          matrixCtx.fill();
        }

        matrixCtx.beginPath();
        matrixCtx.arc(pt.p.x, pt.p.y, radius, 0, Math.PI * 2);
        matrixCtx.fillStyle = idx === 1 || idx === 2 ? '#e53935' : (isD ? '#fff' : '#111');
        matrixCtx.fill();
        matrixCtx.lineWidth = 1.5;
        matrixCtx.strokeStyle = isD ? '#000' : '#fff';
        matrixCtx.stroke();

        matrixCtx.font = '9px monospace';
        matrixCtx.fillStyle = textCol;
        matrixCtx.textAlign = 'center';
        const labelY = pt.p.y < padY + 16 ? pt.p.y + 16 : pt.p.y - 10;
        matrixCtx.fillText(pt.label, pt.p.x, labelY);
      });

      matrixCtx.restore();
    }

    function setupMatrixEvents() {
      if (!matrixCanvas) return;

      function getPointerNorm(e) {
        const rect = matrixCanvas.getBoundingClientRect();
        const clientX = e.clientX;
        const clientY = e.clientY;
        const padX = 28, padY = 22;
        const drawW = Math.max(1, rect.width - padX * 2);
        const drawH = Math.max(1, rect.height - padY * 2);
        const x = (clientX - rect.left - padX) / drawW;
        const y = 1 - (clientY - rect.top - padY) / drawH;
        return {
          x: Math.max(0, Math.min(1, x)),
          y: Math.max(0, Math.min(1, y)),
          pixelX: clientX - rect.left,
          pixelY: clientY - rect.top
        };
      }

      matrixCanvas.addEventListener('pointerdown', (e) => {
        const p = getPointerNorm(e);
        const rect = matrixCanvas.getBoundingClientRect();
        const padX = 28, padY = 22;
        const drawW = rect.width - padX * 2;
        const drawH = rect.height - padY * 2;

        let closestIdx = -1;
        let closestDist = 26;

        matrixPoints.forEach((pt, idx) => {
          const ptPx = padX + pt.x * drawW;
          const ptPy = (rect.height - padY) - pt.y * drawH;
          const dist = Math.hypot(p.pixelX - ptPx, p.pixelY - ptPy);
          if (dist < closestDist) {
            closestDist = dist;
            closestIdx = idx;
          }
        });

        if (closestIdx !== -1) {
          activeDragIdx = closestIdx;
          try { matrixCanvas.setPointerCapture(e.pointerId); } catch(err) {}
          drawMatrixCanvas();
        }
      });

      matrixCanvas.addEventListener('pointermove', (e) => {
        if (activeDragIdx === -1) return;
        const p = getPointerNorm(e);
        matrixPoints[activeDragIdx].x = p.x;
        matrixPoints[activeDragIdx].y = p.y;
        updateMatrixParams();
        drawMatrixCanvas();
        if (soundEnabled) {
          const ctx = getDrumCtx();
          if (ctx.state === 'suspended') ctx.resume();
          playDrum('i', false, 1.0, 0.3);
        }
      });

      const endDrag = (e) => {
        if (activeDragIdx !== -1) {
          try { matrixCanvas.releasePointerCapture(e.pointerId); } catch(err) {}
          activeDragIdx = -1;
          drawMatrixCanvas();
        }
      };

      matrixCanvas.addEventListener('pointerup', endDrag);
      matrixCanvas.addEventListener('pointercancel', endDrag);

      document.querySelectorAll('.m-preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const presetKey = btn.getAttribute('data-preset');
          if (MATRIX_PRESETS[presetKey]) {
            const preset = MATRIX_PRESETS[presetKey];
            matrixPoints.forEach((pt, i) => {
              pt.x = preset[i].x;
              pt.y = preset[i].y;
            });
            document.querySelectorAll('.m-preset-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateMatrixParams();
            drawMatrixCanvas();
            triggerMatrixPulse();
            if (soundEnabled) {
              const ctx = getDrumCtx();
              if (ctx.state === 'suspended') ctx.resume();
              playDrum('a', false, 1.0, 0.75);
            }
          }
        });
      });
    }

    function getCharVolFactor(charObj) {
      if (!charObj) return 1.0;
      if (charObj.sizeMultiplier && charObj.sizeMultiplier !== 1.0) {
        return Math.max(0.25, Math.min(2.5, charObj.sizeMultiplier));
      }
      if (charObj.fontSize) {
        const base = (typeof FONT_SIZE !== 'undefined') ? FONT_SIZE : 260;

    let girlVoice = null;
