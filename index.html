      }, 530);
    }

    function scheduleFrame() {
      if (!animFrameId) {
        animFrameId = requestAnimationFrame(renderFrame);
      }
    }

    function renderFrame() {
      animFrameId = null;
      draw();

      let hasActive = activeKeyChar !== null;
      if (!hasActive) {
        for (const [id, anim] of animations) {
          if (anim.direction === -1 || anim.progress < 1) { hasActive = true; break; }
        }
      }
      if (!hasActive) {
        const nowCheck = performance.now();
        for (const line of (layerTextData[activeLayer] || textData)) {
          for (const c of line) {
            if (c.flashTime && (nowCheck - c.flashTime) < Math.max(FLASH_DURATION, RIPPLE_TOTAL)) { hasActive = true; break; }
          }
          if (hasActive) break;
        }
      }
      if (!hasActive && fadeEnabled) {
        const now = performance.now();
        outer: for (const line of textData) {
          for (const c of line) {
            if (c.doneTime && (now - c.doneTime) < FADE_DURATION) { hasActive = true; break outer; }
          }
        }
      }
      if (!hasActive && (audioEnergy > 0.01 || audioEnergyTarget > 0.01)) {
        hasActive = true;
      }
      if (!hasActive && dMsgActive) {
        hasActive = true;
      }
      if (!hasActive && autoplayActive) {
        hasActive = true;
      }
      if (typeof matrixState !== 'undefined' && matrixState && matrixState.pulseEnergy > 0.02) {
        matrixState.pulseEnergy *= 0.86;
        if (matrixState.pulseEnergy < 0.02) matrixState.pulseEnergy = 0;
        if (typeof drawMatrixCanvas === 'function') drawMatrixCanvas();
        hasActive = true;
      }
      if (hasActive) {
        animFrameId = requestAnimationFrame(renderFrame);
      }
    }

    const FONT_SOURCES = {
      inter: [
        'https://cdn.jsdelivr.net/gh/rsms/inter@v3.19/docs/font-files/Inter-Regular.otf',
        'https://cdn.jsdelivr.net/gh/rsms/inter@v4.0/docs/font-files/InterVariable.woff2',
        'https://cdn.jsdelivr.net/gh/rsms/inter@v3.19/docs/font-files/Inter-Regular.woff2',
      ],
      'space-grotesk': [
        'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/spacegrotesk/SpaceGrotesk[wght].ttf',
      ],
      'roboto-slab': [
        'https://cdn.jsdelivr.net/gh/google/fonts@main/apache/robotoslab/RobotoSlab%5Bwght%5D.ttf',
      ],
      'playfair-display': [
        'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf',
        'https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf',
      ],
      'reading': [
        'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/merriweather/Merriweather%5Bwght%5D.ttf',

      ],
    };

    const fontCache = {};
    let secondaryFont = null;

    const FONT_WEIGHTS = {
      'inter': [100, 200, 300, 400, 500, 600, 700, 800, 900],
      'roboto-slab': [100, 200, 300, 400, 500, 600, 700, 800, 900],
      'space-grotesk': [300, 400, 500, 600, 700]
    };
    const fontCacheWeight = {};

    function nearestWeight(key, w) {
      const list = FONT_WEIGHTS[key];
      if (!list) return 400;
      let best = list[0];
      for (const x of list) if (Math.abs(x - w) < Math.abs(best - w)) best = x;
      return best;
    }

    async function fetchSingleFont(key) {
      const w = nearestWeight(key, fontWeight);
      if (fontCache[key] && fontCacheWeight[key] === w) return fontCache[key];
      const ck = key + '@' + w;
      if (window.EMBEDDED_FONTS && window.EMBEDDED_FONTS[ck]) {
        try {
          const bin = atob(window.EMBEDDED_FONTS[ck]);
          const buf = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
          const parsed = opentype.parse(buf.buffer);
          if (parsed) { fontCache[key] = parsed; fontCacheWeight[key] = w; return parsed; }
        } catch (e) { console.error('embedded font failed', ck, e); }
      }
      const candidates = [];
      if (FONT_WEIGHTS[key]) candidates.push('https://cdn.jsdelivr.net/npm/@fontsource/' + key + '@5/files/' + key + '-latin-' + w + '-normal.woff');
      candidates.push(...(FONT_SOURCES[key] || FONT_SOURCES.inter));
      for (const url of candidates) {
        try {
          const loaded = await opentype.load(url);
          if (loaded) {
            fontCache[key] = loaded;
            fontCacheWeight[key] = w;
            return loaded;
          }
        } catch (e) {}
      }
      if (fontCache[key]) return fontCache[key];
      if (key !== 'inter') return fetchSingleFont('inter');
      return null;
    }

    function initCharObj(charObj) {
      const fontKey = activeLayer || getActiveFontKey();
      charObj.fontType = fontKey;
      charObj.secondaryFontType = polyphonyMode !== 'off' ? secondaryFontKey : null;
      // Store original character for Morse conversion
      charObj.originalChar = charObj.char;
      if (typeof charObj.sizeMultiplier !== 'number') charObj.sizeMultiplier = 1.0;
      return charObj;
    }

    function reassignAllCharFontTypes() {
      for (const k of ALL_LAYER_KEYS) {
        if (layerTextData[k]) {
          for (const line of layerTextData[k]) {
            for (const c of line) {
              c.fontType = k;
            }
          }
        }
      }
      if (Array.isArray(mTextData)) {
        const fontKey = getActiveFontKey();
        for (const line of mTextData) {
          for (const c of line) {
            c.fontType = fontKey;
          }
        }
      }
    }

    function getGlyphForCharObj(charObj) {
      const f = (charObj && charObj.fontType && fontCache[charObj.fontType]) || font;
      if (!f || !charObj || typeof charObj.char !== 'string') return null;
      const glyphs = f.stringToGlyphs(charObj.char);
      return glyphs[0] || null;
    }

    function getSequencerInterval(charObj, currentFontSize = FONT_SIZE) {
      if (!font) return 180;
      const bpm = getSequencerBPM();
      const beatMs = 60000 / bpm;
      const cfs = getCharFontSize(charObj, currentFontSize);
      const scale = cfs / font.unitsPerEm;
      const g = getGlyphForCharObj(charObj);
      const adv = (g && g.advanceWidth) ? g.advanceWidth * scale : cfs * 0.55;
      const charKerning = (charObj && kerningEnabled && charObj.kerning) ? charObj.kerning : 0;

      // Spatial distance = glyph advance + individual held kerning + global kerning
      const spatialDist = Math.max(15, adv + charKerning + globalKerning);
      const refBeatDist = currentFontSize * 0.75;
      const spatialMs = (spatialDist / refBeatDist) * (beatMs * 0.5);

      let finalMs;
      if (charObj && charObj.replayInterval) {
        const speedRatio = bpm / 138;
        const humanMs = charObj.replayInterval / speedRatio;
        finalMs = Math.max(40, Math.min(2500, Math.round(spatialMs * 0.65 + humanMs * 0.35)));
      } else {
        finalMs = Math.max(40, Math.min(2500, Math.round(spatialMs)));
      }

      if (typeof loopEngine !== 'undefined' && loopEngine.mode !== 'straight') {
        const step = loopEngine.stepInCycle || 0;
        const swingAmounts = { evolving: 0.16, glitch: 0.25, ambient: 0.08 };
        const swingFactor = swingAmounts[loopEngine.mode] || 0.16;

        // 16th micro-timing swing groove:
        if (step % 2 === 0) {
          finalMs = Math.round(finalMs * (1 + swingFactor));
        } else {
          finalMs = Math.max(40, Math.round(finalMs * (1 - swingFactor)));
        }

        // Turnaround glitch acceleration
        const sub = step % 16;
        if (loopEngine.mode === 'glitch' && (sub === 7 || sub === 15)) {
          finalMs = Math.max(38, Math.round(finalMs * 0.52));
        } else if (loopEngine.mode === 'evolving' && loopEngine.bar === 3 && sub >= 14) {
          finalMs = Math.max(45, Math.round(finalMs * 0.72));
        }
      }

      return finalMs;
    }

    async function loadFont(restartMessages = true) {
      const key = getActiveFontKey();
      const polyLayers = getActivePolyphonyLayers();
      const fontsToLoad = new Set([key, activeLayer, ...polyLayers]);
      
      for (const k of fontsToLoad) {
        await fetchSingleFont(k);
      }

      font = fontCache[activeLayer] || fontCache[key] || fontCache['inter'];

      // Load secondary font if polyphony is enabled
      if (polyphonyMode !== 'off' && layerMode !== 'single') {
        const secKey = polyLayers.find(k => k !== activeLayer) || secondaryFontKey || 'roboto-slab';
        let secLoaded = await fetchSingleFont(secKey);
        if (!secLoaded) secLoaded = await fetchSingleFont('inter');
        secondaryFont = secLoaded;
      } else {
        secondaryFont = null;
      }

      reassignAllCharFontTypes();
      updateSoundToggleUI();
      updateAmbientDroneState();
      updateActiveLayerSelectOptions();
      renderLayerTabs();

      resetBlink();
      if (isMobile) {
        if (typeof mobileRedraw === 'function') mobileRedraw();
        if (typeof mScheduleRef === 'function') mScheduleRef();
        if (restartMessages && typeof mMsgStart === 'function' && mMsgActive) mMsgStart();
      } else {
        draw();
        canvas.focus();
        if (restartMessages && dMsgActive) dMsgTypeNext();
      }
    }

    if (fontSelect) {
      fontSelect.addEventListener('change', async () => {
        if (polyphonyMode === 'off') {
          updateActiveLayer(fontSelect.value);
        }
        await loadFont(false);
        updateReadingSpeedUI();
      });
    }

    mobileRedraw = null;
    mScheduleRef = null;
    mMsgStart = null;
    mMsgActive = false;
    /* ===== Camera & Playback Scroll Engine ===== */
    let cameraAnimId = null;
    let lastCameraScrollTarget = -1;
    let lastCameraScrollAt = 0;
    let isUserScrolling = false;
    let userScrollTimer = null;

    window.addEventListener('wheel', () => {
      isUserScrolling = true;
      clearTimeout(userScrollTimer);
      userScrollTimer = setTimeout(() => { isUserScrolling = false; }, 1600);
    }, { passive: true });

    window.addEventListener('touchmove', () => {
      isUserScrolling = true;
      clearTimeout(userScrollTimer);
      userScrollTimer = setTimeout(() => { isUserScrolling = false; }, 1600);
    }, { passive: true });

    window.addEventListener('resize', () => {
      if (cameraFollow) {
        scrollCameraToPlayback(false);
      }
    }, { passive: true });

    const playbackTarget = {
      charObj: null,
      line: 0,
      col: 0,
      time: 0
    };

    function updatePlayback(charObj, lineIdx, colIdx) {
      playbackTarget.charObj = charObj || null;
      if (typeof lineIdx === 'number') playbackTarget.line = lineIdx;
      if (typeof colIdx === 'number') playbackTarget.col = colIdx;
      playbackTarget.time = performance.now();
    }

    function getPlaybackY() {
      if (!font) return 0;
      const scale = FONT_SIZE / font.unitsPerEm;
      const ascender = font.ascender * scale;
      const descender = font.descender * scale;
      const lineHeight = (ascender - descender) * DESKTOP_LINE_HEIGHT_RATIO;

      if (lastDisplayLines && lastDisplayLines.length > 0) {
        if (playbackTarget.charObj) {
          for (let dli = 0; dli < lastDisplayLines.length; dli++) {
            const dl = lastDisplayLines[dli];
            if (dl.chars && dl.chars.includes(playbackTarget.charObj)) {
              return PADDING + ascender + dli * (lineHeight + LINE_GAP);
            }
          }
        }

        const tLine = Math.min(playbackTarget.line, Math.max(0, textData.length - 1));
        const tCol = playbackTarget.col;
        let curDli = 0;
        let acc = 0;
        for (let dli = 0; dli < lastDisplayLines.length; dli++) {
          const dl = lastDisplayLines[dli];
          if (dl.srcLine !== tLine) {
            if (dl.srcLine > tLine) break;
            acc += dl.chars.length;
            continue;
          }
          if (dl.srcLine === tLine) {
            if (tCol <= acc + dl.chars.length) {
              curDli = dli;
              break;
            }
            acc += dl.chars.length;
            curDli = dli;
          }
        }
        return PADDING + ascender + curDli * (lineHeight + LINE_GAP);
      }

      return PADDING + ascender + playbackTarget.line * (lineHeight + LINE_GAP);
    }

    function smoothCameraScrollTo(targetY, duration = 300) {
      if (cameraAnimId) cancelAnimationFrame(cameraAnimId);
      const startY = window.scrollY;
      const diff = targetY - startY;
      if (Math.abs(diff) < 2) return;
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        const ease = 1 - Math.pow(1 - t, 3);
        window.scrollTo(0, Math.round(startY + diff * ease));
        if (t < 1) {
          cameraAnimId = requestAnimationFrame(step);
        } else {
          cameraAnimId = null;
        }
      }
      cameraAnimId = requestAnimationFrame(step);
    }

    function scrollCameraToPlayback(force = false) {
      if (isMobile) return;
      if (!cameraFollow && !force) return;
      if (isUserScrolling && !force) return;

      const bl = getPlaybackY();
      if (bl <= 0 && !force) return;

      const rect = canvas.getBoundingClientRect();
      const absY = rect.top + window.scrollY + bl;

      const topPad = 100;
      const bottomPad = 100;
      const viewTop = window.scrollY + topPad;
      const viewBottom = window.scrollY + window.innerHeight - bottomPad;

      if (!force && absY >= viewTop && absY <= viewBottom) {
        return;
      }

      const targetTop = Math.max(0, Math.round(absY - window.innerHeight * 0.42));
      const now = performance.now();
      if (!force && (now - lastCameraScrollAt < 80) && Math.abs(targetTop - lastCameraScrollTarget) < 14) {
        return;
      }

      lastCameraScrollAt = now;
      lastCameraScrollTarget = targetTop;
      smoothCameraScrollTo(targetTop, force ? 380 : 280);
    }

    function scrollCursorIntoView(cursorYOnCanvas) {
      scrollCameraToPlayback(false);
    }

    const dMsgs = [''];
    dMsgActive = false;
    let dMsgIndex = 0;
    let dMsgCharIdx = 0;
    let dMsgTimer = null;
    const dMsgTypeInterval = 100;

    function dMsgTypeNext() {
      if (!dMsgActive || !font) return;
      if (dMsgCharIdx === 0 && typeof loopEngine !== 'undefined') {
        loopEngine.onLoopStart();
      }
      const msg = dMsgs[dMsgIndex];
      if (dMsgCharIdx < msg.length) {
        const ch = msg[dMsgCharIdx];
        const newChar = initCharObj({ char: ch, id: charIdCounter++, done: false, kerning: 0, fontSize: FONT_SIZE });
        // Mark as demo message character to disable fill effect
        newChar.isDemo = true;
        layerTextData[activeLayer][0].splice(cursorCol, 0, newChar);
        cursorCol++;
        updatePlayback(newChar, 0, cursorCol);
        triggerCharFlash(newChar);
        // No sound for demo message - just show text
        // pronounceChar(ch, false, newChar.fontType, newChar, { source: 'dmsg', msg, charIdx: dMsgCharIdx });
        startAnimation(newChar);
        scheduleFrame();
        scrollCameraToPlayback(false);
        dMsgCharIdx++;
        const interval = getSequencerInterval(newChar, FONT_SIZE);
        dMsgTimer = setTimeout(dMsgTypeNext, interval);
      } else {
        dMsgTimer = setTimeout(dMsgStartDelete, 2500);
      }
    }

    function dMsgStartDelete() {
      if (!dMsgActive) return;
      dMsgDeleteNext();
    }

    function dMsgDeleteNext() {
      if (!dMsgActive) return;
      const line = layerTextData[activeLayer][0];
      if (!line || line.length === 0) {
        dMsgIndex++;
        if (dMsgIndex >= dMsgs.length) dMsgIndex = 0;
        dMsgCharIdx = 0;
        cursorCol = 0;
        updatePlayback(null, 0, 0);
        scheduleFrame();
        scrollCameraToPlayback(false);
        dMsgTimer = setTimeout(dMsgTypeNext, 400);
        return;
      }
      const hasNonDeleting = line.some(c => !c.deleting);
      if (hasNonDeleting) {
        const target = line.filter(c => !c.deleting).pop();
        if (target) {
          cursorCol = Math.max(0, cursorCol - 1);
          updatePlayback(target, 0, cursorCol);
          triggerCharFlash(target);
          // No sound for demo message deletion
          // pronounceChar(target.char, true, target.fontType, target);
          startDeleteAnimation(target);
          scheduleFrame();
          scrollCameraToPlayback(false);
        }
        dMsgTimer = setTimeout(dMsgDeleteNext, 30);
      } else {
        dMsgTimer = setTimeout(dMsgDeleteNext, 50);
      }
    }

    function dMsgStop() {
      if (!dMsgActive) return;
      dMsgActive = false;
      clearTimeout(dMsgTimer);
      dMsgTimer = null;
      clearTimeout(englishWordTimer);
      if (typeof speechSynthesis !== 'undefined' && speechSynthesis) speechSynthesis.cancel();
      const activeText = layerTextData[activeLayer] || [[]];
      for (const line of activeText) {
        for (const c of line) animations.delete(c.id);
      }
      layerTextData[activeLayer] = [[]];
      cursorLine = 0;
      cursorCol = 0;
      scheduleFrame();
    }

    function getCursorX(lineIndex, col) {
      const activeText = layerTextData[activeLayer] || [[]];
      const lineChars = activeText[lineIndex] || [];
      const text = lineChars.slice(0, col).map(c => c.char).join('');
      const glyphs = font.stringToGlyphs(text);
      let x = PADDING + LABEL_MARGIN;
      for (let i = 0; i < glyphs.length; i++) {
        const cfs = (lineChars[i] && sizeEnabled) ? lineChars[i].fontSize : FONT_SIZE;

        // Calculate character width - special handling for Morse mode
        if (lineChars[i] && lineChars[i].fontType === 'morse') {
          const morse = charToMorse(lineChars[i].char);
          const symbolCount = morse.length;
          x += cfs * 0.8 * symbolCount; // Each symbol takes 0.8x font size
        } else {
          const s = cfs / font.unitsPerEm;
          x += glyphs[i].advanceWidth * s;
        }

        // Get previous character for optical kerning
        const prevChar = i > 0 && lineChars[i - 1] ? lineChars[i - 1].char : null;
        const currentChar = lineChars[i] ? lineChars[i].char : null;

        // Apply kerning based on mode
        let effectiveKerning = 0;
        if (kerningEnabled) {
          effectiveKerning = lineChars[i].kerning || 0;
        }
        effectiveKerning += getEffectiveKerning(prevChar, currentChar, globalKerning);

        x += effectiveKerning;
      }
      return x;
    }

    function getGlyphProgress(charObj) {
      if (charObj.done) return 1;
      const anim = animations.get(charObj.id);
      if (!anim) return autoplayActive ? 0 : 1;
      return anim.progress;
    }

    function updateAnimations() {
      const now = performance.now();
      const speed = getSpeed();
      const cmdPerSec = speed * 2.5; // Increased for faster animation

      const toRemove = [];
      for (const [id, anim] of animations) {
        const elapsed = (now - anim.startTime) / 1000;
        const totalCmds = anim.totalCmds || 10; // Reduced for faster completion
        const rawProgress = (elapsed * cmdPerSec) / totalCmds;

        if (anim.direction === -1) {
          anim.progress = Math.max(0, 1 - rawProgress);
          if (anim.progress <= 0) {
            toRemove.push(id);
          }
        } else {
          if (anim.progress >= 1) continue;
          anim.progress = Math.min(1, rawProgress);
          if (anim.progress >= 1) {
            anim.progress = 1;
            for (const layerKey in layerTextData) {
              for (const line of layerTextData[layerKey]) {
                for (const c of line) {
                  if (c.id === id) {
                    c.done = true;
                    if (!c.doneTime) c.doneTime = now;
                  }
                }
              }
            }
          }
        }
      }

      for (const id of toRemove) {
        animations.delete(id);
        for (const layerKey in layerTextData) {
          for (let lineIdx = 0; lineIdx < layerTextData[layerKey].length; lineIdx++) {
            const line = layerTextData[layerKey][lineIdx];
            const idx = line.findIndex(c => c.id === id);
            if (idx !== -1) {
              line.splice(idx, 1);
              if (layerKey === activeLayer && cursorCol > idx && cursorLine === lineIdx) {
                cursorCol = Math.max(0, cursorCol - 1);
              }
              break;
            }
          }
        }
      }

      if (activeKeyChar) {
        const held = now - activeKeyDownTime;
        if (kerningEnabled) {
          activeKeyChar.kerning = Math.min(MAX_KERNING, held * KERNING_RATE);
        }
        if (sizeEnabled) {
          const added = held * SIZE_RATE;
          activeKeyChar.sizeMultiplier = Math.min(MAX_FONT_SIZE / FONT_SIZE, 1 + added / FONT_SIZE);
          activeKeyChar.fontSize = Math.min(MAX_FONT_SIZE, Math.round(FONT_SIZE * activeKeyChar.sizeMultiplier));
        }
      }
    }

    function drawMorseVisualization(x, baseline, progress, charFontSize, isDeleting, fadeT, fg, charObj, isSecondary = false) {
      const fs = charFontSize || FONT_SIZE;
      const char = charObj ? charObj.char : 'A';
      const morse = charToMorse(char);
      const symbols = morse.split('');

      const e = audioEnergy;
      const now = performance.now();
      const wf = waveIntensity / 50;
      const waveActive = e > 0.005 && waveIntensity > 0;

      ctx.save();

      // Calculate base Y position centered around baseline
      const yOffset = fs * 0.3;

      symbols.forEach((symbol, index) => {
        const symbolX = x + (index * fs * 0.8);

        if (symbol === '.') {
          // Draw dot
          const dotSize = fs * 0.15;
          const dotY = baseline - yOffset;

          if (waveActive) {
            const waveOffset = Math.sin(now * 0.01 + index * 0.5) * e * 10;
            ctx.beginPath();
            ctx.arc(symbolX + dotSize, dotY + waveOffset, dotSize, 0, Math.PI * 2);
          } else {
            ctx.beginPath();
            ctx.arc(symbolX + dotSize, dotY, dotSize, 0, Math.PI * 2);
          }

          const dotAlpha = fadeEnabled ? Math.max(0, 1 - fadeT) : 1;
          const dotColor = isSecondary ?
            (isDark ? 'rgba(100, 100, 255, 0.4)' : 'rgba(0, 0, 150, 0.4)') :
            getGradationColor(charObj, progress, fadeT, isDeleting, showFill, isDark, fg);

          ctx.fillStyle = dotColor;
          ctx.globalAlpha = dotAlpha;
          ctx.fill();
          ctx.globalAlpha = 1;

        } else if (symbol === '-') {
          // Draw dash
          const dashWidth = fs * 0.5;
          const dashHeight = fs * 0.12;
          const dashX = symbolX + fs * 0.15;
          const dashY = baseline - yOffset - dashHeight / 2;

          if (waveActive) {
            const waveOffset = Math.sin(now * 0.01 + index * 0.5) * e * 10;
            ctx.fillRect(dashX, dashY + waveOffset, dashWidth, dashHeight);
          } else {
            ctx.fillRect(dashX, dashY, dashWidth, dashHeight);
          }

          const dashAlpha = fadeEnabled ? Math.max(0, 1 - fadeT) : 1;
          const dashColor = isSecondary ?
            (isDark ? 'rgba(100, 100, 255, 0.4)' : 'rgba(0, 0, 150, 0.4)') :
            getGradationColor(charObj, progress, fadeT, isDeleting, showFill, isDark, fg);

          ctx.fillStyle = dashColor;
          ctx.globalAlpha = dashAlpha;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      });

      ctx.restore();
    }

    function drawPartialGlyph(glyph, x, baseline, progress, charFontSize, isDeleting, fadeT, fg, charObj, isSecondary = false) {
      const fs = charFontSize || FONT_SIZE;
      const path = glyph.getPath(x, baseline, fs);
      const cmds = path.commands;
      const visibleCount = Math.ceil(progress * cmds.length);
      const e = audioEnergy;
      const now = performance.now();
      const wf = waveIntensity / 50;
      const waveActive = e > 0.005 && waveIntensity > 0;

      // Apply offset for secondary layer
      let offsetX = 0, offsetY = 0;
      if (isSecondary) {
        if (layerMode === 'double') {
          offsetX = 8;
          offsetY = 4;
        } else if (layerMode === 'blended') {
          offsetX = 3;
          offsetY = 2;
        }
      }

      let cxCenter = 0, cyCenter = 0, maxR = 1;
      if (waveActive) {
        let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
        for (let i = 0; i < visibleCount; i++) {
          const c = cmds[i];
          if (c.x !== undefined) { if (c.x < xMin) xMin = c.x; if (c.x > xMax) xMax = c.x; if (c.y < yMin) yMin = c.y; if (c.y > yMax) yMax = c.y; }
          if (c.x1 !== undefined) { if (c.x1 < xMin) xMin = c.x1; if (c.x1 > xMax) xMax = c.x1; if (c.y1 < yMin) yMin = c.y1; if (c.y1 > yMax) yMax = c.y1; }
          if (c.x2 !== undefined) { if (c.x2 < xMin) xMin = c.x2; if (c.x2 > xMax) xMax = c.x2; if (c.y2 < yMin) yMin = c.y2; if (c.y2 > yMax) yMax = c.y2; }
        }
        cxCenter = (xMin + xMax) / 2;
        cyCenter = (yMin + yMax) / 2;
        maxR = Math.max(1, Math.hypot(xMax - xMin, yMax - yMin) / 2);
      }
      const SUB = waveActive ? Math.max(2, Math.round(wf * 10)) : 0;

      function wave(px, py) {
        if (!waveActive) return { x: px + offsetX, y: py + offsetY };

        const dx = px - cxCenter;
        const dy = py - cyCenter;
        const dist = Math.hypot(dx, dy);
        const t = Math.min(1, dist / maxR);
        const binF = t * (WAVE_BINS - 1);
        const lo = Math.floor(binF);
        const hi = Math.min(lo + 1, WAVE_BINS - 1);
        const frac = binF - lo;
        const amp = waveData[lo] * (1 - frac) + waveData[hi] * frac;
        const phase = t * Math.PI * 6 + now * 0.005;
        const displacement = Math.sin(phase) * amp * fs * 0.06 * wf;
        const angle = Math.atan2(dy, dx);
        return { x: px + Math.cos(angle) * displacement + offsetX, y: py + Math.sin(angle) * displacement + offsetY };
      }

      ctx.beginPath();
      let cx = 0, cy = 0;
      for (let i = 0; i < visibleCount; i++) {
        const cmd = cmds[i];
        if (SUB > 0) {
          switch (cmd.type) {
            case 'M': { const p = wave(cmd.x, cmd.y); ctx.moveTo(p.x, p.y); cx = cmd.x; cy = cmd.y; break; }
            case 'L': {
              for (let s = 1; s <= SUB; s++) {
                const t = s / SUB;
                const p = wave(cx + (cmd.x - cx) * t, cy + (cmd.y - cy) * t);
                ctx.lineTo(p.x, p.y);
              }
              cx = cmd.x; cy = cmd.y; break;
            }
            case 'Q': {
              for (let s = 1; s <= SUB; s++) {
                const t = s / SUB, mt = 1 - t;
                const p = wave(
                  mt * mt * cx + 2 * mt * t * cmd.x1 + t * t * cmd.x,
                  mt * mt * cy + 2 * mt * t * cmd.y1 + t * t * cmd.y
                );
                ctx.lineTo(p.x, p.y);
              }
              cx = cmd.x; cy = cmd.y; break;
            }
            case 'C': {
              for (let s = 1; s <= SUB; s++) {
                const t = s / SUB, mt = 1 - t;
                const p = wave(
                  mt*mt*mt*cx + 3*mt*mt*t*cmd.x1 + 3*mt*t*t*cmd.x2 + t*t*t*cmd.x,
                  mt*mt*mt*cy + 3*mt*mt*t*cmd.y1 + 3*mt*t*t*cmd.y2 + t*t*t*cmd.y
                );
                ctx.lineTo(p.x, p.y);
              }
              cx = cmd.x; cy = cmd.y; break;
            }
            case 'Z': ctx.closePath(); break;
          }
        } else {
          switch (cmd.type) {
            case 'M': ctx.moveTo(cmd.x, cmd.y); cx = cmd.x; cy = cmd.y; break;
            case 'L': ctx.lineTo(cmd.x, cmd.y); cx = cmd.x; cy = cmd.y; break;
            case 'Q': ctx.quadraticCurveTo(cmd.x1, cmd.y1, cmd.x, cmd.y); cx = cmd.x; cy = cmd.y; break;
            case 'C': ctx.bezierCurveTo(cmd.x1, cmd.y1, cmd.x2, cmd.y2, cmd.x, cmd.y); cx = cmd.x; cy = cmd.y; break;
            case 'Z': ctx.closePath(); break;
          }
        }
      }

      let gYMin = Infinity, gYMax = -Infinity;
      for (let i = 0; i < visibleCount; i++) {
        const c = cmds[i];
        if (c.y !== undefined) { if (c.y < gYMin) gYMin = c.y; if (c.y > gYMax) gYMax = c.y; }
        if (c.y1 !== undefined) { if (c.y1 < gYMin) gYMin = c.y1; if (c.y1 > gYMax) gYMax = c.y1; }
        if (c.y2 !== undefined) { if (c.y2 < gYMin) gYMin = c.y2; if (c.y2 > gYMax) gYMax = c.y2; }
      }
      if (!isFinite(gYMin) || gYMax - gYMin < 8) {
        const scale = fs / (font ? font.unitsPerEm : 1000);
        const asc = (font ? font.ascender : 800) * scale;
        const desc = (font ? font.descender : -200) * scale;
        gYMin = baseline - asc;
        gYMax = baseline - desc;
      }

      const fillColor = getGradationColor(charObj, progress, fadeT, isDeleting, showFill, isDark, fg);
      if (isSecondary) {
        // Apply different color for secondary layer
        if (layerMode === 'blended') {
          ctx.globalAlpha = 0.6;
        } else {
          ctx.globalAlpha = 0.4;
        }
        if (colorPalette === 'rainbow') {
          const hue = getCharHue(charObj) + 180; // Complementary color
          ctx.fillStyle = `hsla(${hue}, 70%, 50%, ${ctx.globalAlpha})`;
        } else {
          ctx.fillStyle = isDark ? `rgba(100, 100, 255, ${ctx.globalAlpha})` : `rgba(0, 0, 150, ${ctx.globalAlpha})`;
        }
      } else {
        ctx.globalAlpha = 1;
        ctx.fillStyle = fillColor;
      }

      // Apply frequency-based visual effects
      let shadowApplied = false;
      if (gradationMode !== 'off' && !isSecondary) {
        const e = audioEnergy;
        const bands = audioBands;

        if (gradationMode === 'frequency' || gradationMode === 'spectrum') {
          // Add glow effect based on frequency bands
          const bandIndex = charObj ? (charObj.id % 4) : 0;
          const bandEnergy = bands[bandIndex] || 0;

          if (bandEnergy > 0.1) {
            ctx.save();
            ctx.shadowColor = fillColor;
            ctx.shadowBlur = 10 + bandEnergy * 20;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            shadowApplied = true;
          }
        }

        if (gradationMode === 'energy') {
          // Add pulse effect based on overall energy
          if (e > 0.1) {
            ctx.save();
            ctx.shadowColor = isDark ? 'rgba(255, 100, 100, 0.8)' : 'rgba(255, 50, 50, 0.6)';
            ctx.shadowBlur = 5 + e * 30;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            shadowApplied = true;
          }
        }
      }

      if (isDeleting && progress < 1) {
        ctx.fill();
      } else if (progress < 1) {
        ctx.fill();
      } else if (fadeT < 1) {
        ctx.fill();
      } else if (showFill && !isDeleting) {
        ctx.fill();
      }

      // Restore context if shadow was applied
      if (shadowApplied) {
        ctx.restore();
      }

      ctx.globalAlpha = 1;

      if (!showFill) {
        let strokeColor = getGlyphStrokeColor(charObj, isDark, fg, e, 1);

        // Apply gradation to stroke as well
        if (gradationMode !== 'off') {
          const currentBands = audioBands;
          if (gradationMode === 'energy') {
            const energy = Math.min(1, e * 2);
            if (isDark) {
              strokeColor = `rgba(${Math.floor(255 * energy)}, ${Math.floor(50 + 100 * (1 - energy))}, ${Math.floor(50 + 50 * (1 - energy))}, 1)`;
            } else {
              strokeColor = `rgba(${Math.floor(200 + 55 * energy)}, ${Math.floor(50 * (1 - energy))}, ${Math.floor(50 * (1 - energy))}, 1)`;
            }
          } else if (gradationMode === 'frequency') {
            const bandIndex = charObj ? (charObj.id % 4) : 0;
            const bandEnergy = currentBands[bandIndex] || 0;
            const colors = [
              'rgba(255, 100, 100, 1)',
              'rgba(100, 255, 100, 1)',
              'rgba(100, 100, 255, 1)',
              'rgba(255, 255, 100, 1)'
            ];
            strokeColor = colors[bandIndex];
          } else if (gradationMode === 'spectrum') {
            const hue = getCharHue(charObj);
            strokeColor = `hsla(${hue}, 80%, 50%, 1)`;
          }
        }

        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1.2 + e * 3;
        ctx.stroke();
      }

      const vertexAlpha = fadeEnabled ? Math.max(0, 1 - fadeT) : 1;

      const points = [];
      let vertexIndex = 0;
      for (let i = 0; i < visibleCount; i++) {
        const cmd = cmds[i];
        if (cmd.type === 'Z') continue;
        if (cmd.x1 !== undefined && cmd.y1 !== undefined)
          points.push({ x: cmd.x1, y: cmd.y1, onCurve: false, index: vertexIndex++ });
        if (cmd.x2 !== undefined && cmd.y2 !== undefined)
          points.push({ x: cmd.x2, y: cmd.y2, onCurve: false, index: vertexIndex++ });
        if (cmd.x !== undefined && cmd.y !== undefined)
          points.push({ x: cmd.x, y: cmd.y, onCurve: true, index: vertexIndex++ });
      }

      if (vertexAlpha > 0.001) {
      let lastOnCurve = null;
      ctx.save();
      let polyStroke;
      if (colorPalette === 'rainbow') {
        const hue = getCharHue(charObj);
        polyStroke = 'hsla(' + hue + ', 80%, ' + (isDark ? '65%' : '45%') + ', ' + (Math.min(1, 0.2 + e * 0.6) * vertexAlpha).toFixed(3) + ')';
      } else {
        polyStroke = 'rgba(' + fg + ', ' + (Math.min(1, 0.15 + e * 0.6) * vertexAlpha).toFixed(3) + ')';
      }
      ctx.strokeStyle = polyStroke;
      ctx.lineWidth = 0.7 + e * 2;
      ctx.setLineDash([3, 3]);
      for (let i = 0; i < visibleCount; i++) {
        const cmd = cmds[i];
        if (cmd.type === 'M') {
          lastOnCurve = { x: cmd.x, y: cmd.y };
        } else if (cmd.type === 'L') {
          lastOnCurve = { x: cmd.x, y: cmd.y };
        } else if (cmd.type === 'Q') {
          if (lastOnCurve) {
            const w0 = wave(lastOnCurve.x, lastOnCurve.y);
            const w1 = wave(cmd.x1, cmd.y1);
            const w2 = wave(cmd.x, cmd.y);
            ctx.beginPath(); ctx.moveTo(w0.x, w0.y); ctx.lineTo(w1.x, w1.y); ctx.lineTo(w2.x, w2.y); ctx.stroke();
          }
          lastOnCurve = { x: cmd.x, y: cmd.y };
        } else if (cmd.type === 'C') {
          if (lastOnCurve) {
            const w0 = wave(lastOnCurve.x, lastOnCurve.y);
            const w1 = wave(cmd.x1, cmd.y1);
            const w2 = wave(cmd.x2, cmd.y2);
            const w3 = wave(cmd.x, cmd.y);
            ctx.beginPath(); ctx.moveTo(w0.x, w0.y); ctx.lineTo(w1.x, w1.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(w3.x, w3.y); ctx.lineTo(w2.x, w2.y); ctx.stroke();
          }
          lastOnCurve = { x: cmd.x, y: cmd.y };
        } else if (cmd.type === 'Z') {
          lastOnCurve = null;
        }
      }
      ctx.setLineDash([]);
      ctx.restore();

      }
    }

    const FLASH_DURATION = 300;
    const RIPPLE_DURATION = 2250;
    const RIPPLE_COUNT = 10;
    const RIPPLE_STAGGER = 175;
    const RIPPLE_TOTAL = RIPPLE_DURATION + (RIPPLE_COUNT - 1) * RIPPLE_STAGGER;

    // Contour-map ripple: on sound, offset outlines of the glyph appear like topographic contour lines
    function drawOutlineRipple(glyph, x, baseline, fs, charObj, fg) {
      if (!charObj || !charObj.flashTime) return;
      const elapsed = performance.now() - charObj.flashTime;
      if (elapsed <= 0 || elapsed >= RIPPLE_TOTAL) return;
      const cmds = glyph.getPath(x, baseline, fs).commands;
      if (!cmds.length) return;

      // Sample outline into closed polylines
      const SUB = 6;
      const polys = [];
      let cur = null, px = 0, py = 0;
      for (const c of cmds) {
        if (c.type === 'M') { cur = [[c.x, c.y]]; polys.push(cur); px = c.x; py = c.y; }
        else if (c.type === 'Z') { cur = null; }
        else if (cur) {
          for (let s = 1; s <= SUB; s++) {
            const u = s / SUB, mu = 1 - u;
            let qx, qy;
            if (c.type === 'L') { qx = px + (c.x - px) * u; qy = py + (c.y - py) * u; }
            else if (c.type === 'Q') { qx = mu*mu*px + 2*mu*u*c.x1 + u*u*c.x; qy = mu*mu*py + 2*mu*u*c.y1 + u*u*c.y; }
            else { qx = mu*mu*mu*px + 3*mu*mu*u*c.x1 + 3*mu*u*u*c.x2 + u*u*u*c.x; qy = mu*mu*mu*py + 3*mu*mu*u*c.y1 + 3*mu*u*u*c.y2 + u*u*u*c.y; }
            cur.push([qx, qy]);
          }
          px = c.x; py = c.y;
        }
      }
      for (let k = 0; k < polys.length; k++) {
        const src = polys[k], out = [];
        for (const q of src) {
          const last = out[out.length - 1];
          if (!last || Math.hypot(q[0] - last[0], q[1] - last[1]) > 0.5) out.push(q);
        }
        while (out.length > 2 && Math.hypot(out[0][0] - out[out.length - 1][0], out[0][1] - out[out.length - 1][1]) <= 0.5) out.pop();
        polys[k] = out;
      }
      const info = polys.filter(p => p.length > 2).map(p => {
        let a = 0;
        for (let i = 0; i < p.length; i++) { const q = p[i], r = p[(i + 1) % p.length]; a += q[0] * r[1] - r[0] * q[1]; }
        return { p, area: a / 2 };
      });
      if (!info.length) return;
      let outer = info[0];
      for (const it of info) if (Math.abs(it.area) > Math.abs(outer.area)) outer = it;
      const outSign = Math.sign(outer.area) || 1;

      const spacing = fs * 0.05;
      const wf = waveIntensity / 50;
      const waveOn = audioEnergy > 0.005 && waveIntensity > 0;
      const nowW = performance.now();

      for (let ri = 0; ri < RIPPLE_COUNT; ri++) {
        const t = (elapsed - ri * RIPPLE_STAGGER) / RIPPLE_DURATION;
        if (t <= 0 || t >= 1) continue;
        const grow = 1 - Math.pow(1 - Math.min(1, t * 3), 3);
        let off = (ri + 1) * spacing * grow * (1 + 0.35 * t);
        let wAmp = 0;
        if (waveOn) {
          const bin = Math.min(WAVE_BINS - 1, Math.floor((ri / RIPPLE_COUNT) * (WAVE_BINS - 1)));
          wAmp = waveData[bin] * fs * 0.04 * wf * (1 - ri / RIPPLE_COUNT);
        }
        const wobble = spacing * 0.45 * ((ri + 1) / RIPPLE_COUNT);

        ctx.save();
        ctx.beginPath();
        for (const it of info) {
          const hole = Math.sign(it.area) !== outSign;
          if (hole && off > Math.sqrt(Math.abs(it.area)) * 0.4) continue;
          const p = it.p, n = p.length;
          for (let i = 0; i < n; i++) {
            const a = p[(i - 2 + n) % n], b = p[(i + 2) % n];
            let tx = b[0] - a[0], ty = b[1] - a[1];
            const tl = Math.hypot(tx, ty) || 1;
            const nx = (ty / tl) * outSign, ny = (-tx / tl) * outSign;
            const q = p[i];
            let d = off;
            d += wobble * Math.sin(q[0] * 0.035 + ri * 0.9) * Math.cos(q[1] * 0.031 - ri * 0.6);
            if (wAmp) d += Math.sin(i / n * Math.PI * 8 + nowW * 0.004 + ri) * wAmp;
            const X = q[0] + nx * d, Y = q[1] + ny * d;
            if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
          }
          ctx.closePath();
        }
        const fade = Math.pow(1 - t, 1.3) * (1 - (ri / RIPPLE_COUNT) * 0.7);
        const a = Math.max(0, fade * 0.95);
        if (colorPalette === 'rainbow' && !(randomColors && rndFg)) {
          ctx.strokeStyle = 'hsla(' + getCharHue(charObj) + ', 100%, 55%, ' + a.toFixed(3) + ')';
        } else {
          ctx.strokeStyle = 'rgba(' + fg + ', ' + a.toFixed(3) + ')';
        }
        const isIndex = (ri % 5) === 4;
        ctx.lineWidth = (isIndex ? 1.8 : 0.8) * (1 - (ri / RIPPLE_COUNT) * 0.5);
        ctx.lineJoin = 'round';
        ctx.setLineDash([]);
        ctx.stroke();
        ctx.restore();
      }
    }

    function triggerFlash() {
    }

    window.triggerCharFlash = function(charObj) {
      if (charObj) charObj.flashTime = performance.now();
    };

    let lastDesktopTypeAt = 0;
    function tagDesktopTyping(charObj) {
      if (!charObj) return;
      const now = performance.now();
      if (lastDesktopTypeAt > 0) {
        charObj.replayInterval = Math.max(40, Math.min(1200, now - lastDesktopTypeAt));
      }
      lastDesktopTypeAt = now;
    }

    /* ===== Auto-play sequencer (user typing only) ===== */
    const AUTOPLAY_DELAY = 2000;
    let autoplayTimer = null;
    let autoplaySeqTimer = null;
    let autoplayIndex = -1;
    let autoplayLine = 0;
    autoplayActive = false;
    let repeatEnabled = true;

    function updateRepeatUI() {
      const repeatBtn = document.getElementById('repeatToggle');
      if (repeatBtn) {
        repeatBtn.textContent = repeatEnabled ? 'Repeat: Stop' : 'Repeat: Play';
        repeatBtn.classList.toggle('active', repeatEnabled);
      }
      const mRepeatBtn = document.getElementById('mRepeat');
      if (mRepeatBtn) {
        mRepeatBtn.textContent = repeatEnabled ? 'REPEAT: STOP' : 'REPEAT: PLAY';
        mRepeatBtn.classList.toggle('active', repeatEnabled);
      }
    }

    function toggleRepeat() {
      repeatEnabled = !repeatEnabled;
      if (!repeatEnabled) {
        stopAutoplay();
        clearTimeout(autoplayTimer);
        autoplayTimer = null;
        if (typeof mStopAutoplay === 'function') mStopAutoplay();
        if (typeof mAutoplayTimer !== 'undefined') {
          clearTimeout(mAutoplayTimer);
          mAutoplayTimer = null;
        }
      } else {
        if (soundEnabled && typeof getDrumCtx === 'function') {
          try {
            const ctx = getDrumCtx();
            if (ctx.state === 'suspended') ctx.resume();
          } catch(e) {}
        }
        const chars = collectAutoplayChars();
        if (chars.length > 0) {
          startAutoplay();
        }
        if (typeof mTextData !== 'undefined' && mTextData[0]) {
          const mChars = mTextData[0].filter(c => !c.deleting);
          if (mChars.length > 0 && typeof mStartAutoplay === 'function') {
            mStartAutoplay();
          }
        }
      }
      updateRepeatUI();
      scheduleFrame();
      if (typeof mSchedule === 'function') mSchedule();
    }

    const repeatToggle = document.getElementById('repeatToggle');
    if (repeatToggle) {
      repeatToggle.addEventListener('click', toggleRepeat);
    }

    function collectAutoplayChars() {
      const chars = [];
      const polyLayers = getActivePolyphonyLayers();
      const isMulti = (polyphonyMode !== 'off' && layerMode !== 'single' && polyLayers.length > 1);
      const layersToCheck = isMulti ? polyLayers : [activeLayer];
      for (const lKey of layersToCheck) {
        const lData = layerTextData[lKey] || [];
        for (const line of lData) {
          for (const c of line) {
            if (!c.deleting) chars.push(c);
          }
        }
      }
      return chars;
    }

    function resetAutoplayTimer() {
      stopAutoplay();
      clearTimeout(autoplayTimer);
      if (dMsgActive || !repeatEnabled) return;
      const allChars = collectAutoplayChars();
      if (allChars.length > 0) {
        autoplayTimer = setTimeout(startAutoplay, AUTOPLAY_DELAY);
      }
    }

    let autoplayStepIdx = -1;

    function startAutoplay() {
      if (dMsgActive || !repeatEnabled) return;
      const chars = collectAutoplayChars();
      if (chars.length === 0) return;
      if (typeof loopEngine !== 'undefined') {
        loopEngine.onLoopStart();
      }
      autoplayActive = true;
      autoplayLine = 0;
      autoplayIndex = -1;
      autoplayStepIdx = -1;
      for (const c of chars) {
        c.done = false;
        c.doneTime = null;
        animations.delete(c.id);
      }
      if (chars[0]) updatePlayback(chars[0], 0, 0);
      updateRepeatUI();
      scheduleFrame();
      scrollCameraToPlayback(true);
      stepAutoplay();
    }

    function stopAutoplay() {
      if (autoplayActive) {
        const chars = collectAutoplayChars();
        for (const c of chars) {
          if (!c.done) {
            c.done = true;
            c.doneTime = performance.now();
          }
          animations.delete(c.id);
        }
      }
      autoplayActive = false;
      autoplayLine = 0;
      autoplayIndex = -1;
      autoplayStepIdx = -1;
      clearTimeout(autoplaySeqTimer);
      autoplaySeqTimer = null;
      clearTimeout(englishWordTimer);
      updatePlayback(null, cursorLine, cursorCol);
      updateRepeatUI();
      scheduleFrame();
    }

    function stepAutoplay() {
      if (!autoplayActive || dMsgActive || !repeatEnabled) { stopAutoplay(); return; }

      const polyLayers = getActivePolyphonyLayers();
      const isMulti = (polyphonyMode !== 'off' && layerMode !== 'single' && polyLayers.length > 1);

      if (isMulti) {
        autoplayStepIdx++;
        const streams = polyLayers.map(k => (layerTextData[k] || []).flat().filter(c => !c.deleting));
        const maxLen = Math.max(...streams.map(s => s.length));
        if (maxLen === 0) { stopAutoplay(); return; }

        if (autoplayStepIdx < maxLen) {
          let refChar = null;
          streams.forEach(stream => {
            if (stream.length > 0) {
              const ch = stream[autoplayStepIdx % stream.length];
              if (ch) {
                refChar = refChar || ch;
                ch.done = false;
                ch.doneTime = null;
                startAnimation(ch);
                pronounceChar(ch.char, false, ch.fontType, ch, { source: 'autoplay' });
                playSustainFor(ch);
                triggerCharFlash(ch);
              }
            }
          });
          if (refChar) updatePlayback(refChar, 0, autoplayStepIdx);
          scheduleFrame();
          const interval = getSequencerInterval(refChar || { fontType: activeLayer }, FONT_SIZE);
          autoplaySeqTimer = setTimeout(stepAutoplay, interval);
          return;
        }
        if (!repeatEnabled) { stopAutoplay(); return; }
        autoplaySeqTimer = setTimeout(startAutoplay, AUTOPLAY_DELAY);
        return;
      }

      // Single mode autoplay
      autoplayIndex++;
      const activeText = layerTextData[activeLayer] || [[]];
      while (autoplayLine < activeText.length) {
        const line = activeText[autoplayLine];
        while (autoplayIndex < line.length) {
          const ch = line[autoplayIndex];
          if (ch && !ch.deleting) {
            ch.done = false;
            ch.doneTime = null;
            updatePlayback(ch, autoplayLine, autoplayIndex);
            startAnimation(ch);
            pronounceChar(ch.char, false, ch.fontType, ch, { source: 'autoplay', line, index: autoplayIndex });
            playSustainFor(ch);
            triggerCharFlash(ch);
            scheduleFrame();
            scrollCameraToPlayback(autoplayLine === 0 && autoplayIndex === 0);
            const interval = getSequencerInterval(ch, FONT_SIZE);
            autoplaySeqTimer = setTimeout(stepAutoplay, interval);
            return;
          }
          autoplayIndex++;
        }
        autoplayLine++;
        autoplayIndex = 0;
      }
      if (!repeatEnabled) { stopAutoplay(); return; }
      autoplaySeqTimer = setTimeout(startAutoplay, AUTOPLAY_DELAY);
    }

    let lastDisplayLines = [];

    function getDisplayLinesForLayer(layerKey, wrapWidth) {
      const lFont = fontCache[layerKey] || font;
      const lData = layerTextData[layerKey] || [[]];
      const textLines = lData.map(line => line.map(c => c.char).join(''));
      const dLines = [];
      let maxAdv = 0;

      for (let li = 0; li < lData.length; li++) {
        const lineChars = lData[li];
        const glyphs = lFont ? lFont.stringToGlyphs(textLines[li]) : [];
        let rowChars = [];
        let rowGlyphs = [];
        let rowW = 0;
        let rowStartCol = 0;
        let lastSpaceIdx = -1;
        let wAtSpace = 0;
        let charsAtSpace = 0;

        for (let gi = 0; gi < glyphs.length; gi++) {
          const charObj = lineChars[gi];
          const cfs = getCharFontSize(charObj, FONT_SIZE);
          let charW;
          if (charObj && charObj.fontType === 'morse') {
            const morse = charToMorse(charObj.char);
            charW = cfs * 0.8 * morse.length;
          } else {
            charW = glyphs[gi].advanceWidth * (cfs / (lFont ? lFont.unitsPerEm : 1000));
          }

          let effectiveKerning = 0;
          if (kerningEnabled) {
            effectiveKerning = charObj ? (charObj.kerning || 0) : 0;
            const prevChar = gi > 0 && lineChars[gi - 1] ? lineChars[gi - 1].char : null;
            const currentChar = charObj ? charObj.char : null;
            effectiveKerning += getEffectiveKerning(prevChar, currentChar, globalKerning);
          }
          charW += effectiveKerning;

          if (charObj && charObj.char === ' ') {
            lastSpaceIdx = gi;
            wAtSpace = rowW + charW;
            charsAtSpace = rowChars.length + 1;
          }

          if (rowChars.length > 0 && rowW + charW > wrapWidth) {
            if (lastSpaceIdx >= 0 && lastSpaceIdx >= rowStartCol) {
              const breakAt = charsAtSpace;
              if (wAtSpace > maxAdv) maxAdv = wAtSpace;
              dLines.push({ chars: rowChars.slice(0, breakAt), glyphs: rowGlyphs.slice(0, breakAt), srcLine: li, srcCol: rowStartCol });
              rowStartCol += breakAt;
              rowChars = rowChars.slice(breakAt);
              rowGlyphs = rowGlyphs.slice(breakAt);
              rowW = 0;
              for (let k = 0; k < rowGlyphs.length; k++) {
                const kfs = getCharFontSize(rowChars[k], FONT_SIZE);
                let kAdv = (rowChars[k] && rowChars[k].fontType === 'morse')
                  ? kfs * 0.8 * charToMorse(rowChars[k].char).length
                  : rowGlyphs[k].advanceWidth * (kfs / (lFont ? lFont.unitsPerEm : 1000));
                let kEff = 0;
                if (kerningEnabled) {
                  kEff = rowChars[k] ? (rowChars[k].kerning || 0) : 0;
                  const kp = k > 0 && rowChars[k - 1] ? rowChars[k - 1].char : null;
                  const kc = rowChars[k] ? rowChars[k].char : null;
                  kEff += getEffectiveKerning(kp, kc, globalKerning);
                }
                rowW += kAdv + kEff;
              }
              lastSpaceIdx = -1;
            } else {
              if (rowW > maxAdv) maxAdv = rowW;
              dLines.push({ chars: rowChars, glyphs: rowGlyphs, srcLine: li, srcCol: rowStartCol });
              rowStartCol += rowChars.length;
              rowChars = [];
              rowGlyphs = [];
              rowW = 0;
              lastSpaceIdx = -1;
            }
          }
          rowChars.push(charObj);
          rowGlyphs.push(glyphs[gi]);
          rowW += charW;
        }
        dLines.push({ chars: rowChars, glyphs: rowGlyphs, srcLine: li, srcCol: rowStartCol });
        if (rowW > maxAdv) maxAdv = rowW;
      }
      return { displayLines: dLines, maxAdvance: maxAdv };
    }

    function draw() {
      if (!font) return;

      if (soundEnabled) {
        updateAudioEnergy();
      }
      updateAnimations();

      const now = performance.now();
      const baseBg = isDark ? 0 : 230;
      const baseFg = isDark ? 255 : 0;
      const useRnd = randomColors && rndBg;
      const bg = useRnd ? 'rgb(' + rndBg + ')' : 'rgb(' + baseBg + ',' + baseBg + ',' + baseBg + ')';
      const fg = useRnd ? rndFg : baseFg + ', ' + baseFg + ', ' + baseFg;

      const scale = FONT_SIZE / font.unitsPerEm;
      const ascender = font.ascender * scale;
      const descender = font.descender * scale;
      const xHeight = (font.tables.os2 && font.tables.os2.sxHeight)
        ? font.tables.os2.sxHeight * scale
        : ascender * 0.52;

      const lineHeight = (ascender - descender) * DESKTOP_LINE_HEIGHT_RATIO;

      let maxCharSize = FONT_SIZE;
      if (sizeEnabled) {
        for (const k of ALL_LAYER_KEYS) {
          const lData = layerTextData[k];
          if (lData) {
            for (const line of lData) {
              for (const c of line) {
                const cs = getCharFontSize(c, FONT_SIZE);
                if (cs > maxCharSize) maxCharSize = cs;
              }
            }
          }
        }
      }
      const maxScale = maxCharSize / font.unitsPerEm;
      const maxAsc = font.ascender * maxScale;
      const maxDesc = font.descender * maxScale;
      const maxLineH = (maxAsc - maxDesc) * DESKTOP_LINE_HEIGHT_RATIO;

      const typoCol = document.getElementById('typography-column');
      const typoAvailW = typoCol && typoCol.clientWidth > 0 ? typoCol.clientWidth : (window.innerWidth * 0.72);
      const maxCanvasW = Math.max(typoAvailW, 320);
      const wrapWidth = maxCanvasW - PADDING * 2 - LABEL_MARGIN * 2;

      const polyLayers = getActivePolyphonyLayers();
      const isMultiLayer = (polyphonyMode !== 'off' && layerMode !== 'single' && polyLayers.length > 1);

      // Inactive layers rendered first, active layer rendered on top
      const layersToRender = isMultiLayer
        ? [...polyLayers.filter(k => k !== activeLayer).map((k, i) => ({ key: k, isSecondary: true, layerIdx: i + 1 })),
           { key: activeLayer, isSecondary: false, layerIdx: 0 }]
        : [{ key: activeLayer, isSecondary: false, layerIdx: 0 }];

      let overallMaxAdvance = 0;
      let overallMaxLines = 1;
      const renderedLayerData = [];

      for (const item of layersToRender) {
        const lFont = fontCache[item.key] || font;
        const layout = getDisplayLinesForLayer(item.key, wrapWidth);
        if (layout.maxAdvance > overallMaxAdvance) overallMaxAdvance = layout.maxAdvance;
        if (layout.displayLines.length > overallMaxLines) overallMaxLines = layout.displayLines.length;
        if (item.key === activeLayer) {
          lastDisplayLines = layout.displayLines;
        }
        renderedLayerData.push({ ...item, font: lFont, displayLines: layout.displayLines });
      }

      const minWidth = Math.min(maxCanvasW, isMobile ? Math.min(window.innerWidth, 320) : 320);
      const canvasW = Math.min(maxCanvasW, Math.max(overallMaxAdvance + PADDING * 2 + LABEL_MARGIN * 2, minWidth));
      const canvasH = overallMaxLines * Math.max(lineHeight, maxLineH) + (overallMaxLines - 1) * LINE_GAP + PADDING * 2;

      canvas.width = canvasW * DPR;
      canvas.height = canvasH * DPR;
      canvas.style.width = canvasW + 'px';
      canvas.style.height = canvasH + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvasW, canvasH);

      // Draw metric lines
      for (let mli = 0; mli < overallMaxLines; mli++) {
        const off = mli * (lineHeight + LINE_GAP);
        drawMetricLines(canvasW, PADDING + ascender + off, PADDING + off, PADDING + ascender - xHeight + off, PADDING + ascender - descender + off, fg);
      }

      // Render each layer
      for (const rLayer of renderedLayerData) {
        const lFont = rLayer.font;
        const dLines = rLayer.displayLines;
        const isSecondary = rLayer.isSecondary;

        for (let dli = 0; dli < dLines.length; dli++) {
          const dl = dLines[dli];
          const baseline = PADDING + ascender + dli * (lineHeight + LINE_GAP);
          let x = PADDING + LABEL_MARGIN;

          for (let gi = 0; gi < dl.glyphs.length; gi++) {
            const glyph = dl.glyphs[gi];
            const charObj = dl.chars[gi];
            const cfs = getCharFontSize(charObj, FONT_SIZE);

            let charW;
            if (charObj && charObj.fontType === 'morse') {
              const morse = charToMorse(charObj.char);
              charW = cfs * 0.8 * morse.length;
            } else {
              charW = glyph.advanceWidth * (cfs / (lFont ? lFont.unitsPerEm : 1000));
            }

            let effectiveKerning = 0;
            if (kerningEnabled) {
              effectiveKerning = charObj ? (charObj.kerning || 0) : 0;
              const prevCh = gi > 0 && dl.chars[gi - 1] ? dl.chars[gi - 1].char : null;
              effectiveKerning += getEffectiveKerning(prevCh, charObj ? charObj.char : null, globalKerning);
            }

            if (!isSecondary && charObj && charObj.flashTime) {
              const ft = 1 - Math.min(1, (now - charObj.flashTime) / FLASH_DURATION);
              if (ft > 0) {
                let flashStyle;
                if (colorPalette === 'rainbow') {
                  const hue = getCharHue(charObj);
                  flashStyle = 'hsla(' + hue + ', 100%, 50%, ' + (ft * 0.45).toFixed(3) + ')';
                } else if (colorPalette === 'mono') {
                  flashStyle = 'rgba(' + fg + ', ' + (ft * 0.35).toFixed(3) + ')';
                } else {
                  flashStyle = 'rgba(255, 0, 0, ' + (ft * 0.8).toFixed(3) + ')';
                }
                ctx.fillStyle = flashStyle;
                const pad = 4;
                ctx.fillRect(x - pad, baseline - ascender - pad, charW + pad * 2 + effectiveKerning, ascender - descender + pad * 2);
              }
            }

            const progress = charObj ? getGlyphProgress(charObj) : 1;
            const isDeleting = charObj && charObj.deleting;
            let fadeT = 1;
            if (fadeEnabled && charObj && charObj.doneTime && !isDeleting) {
              fadeT = Math.min(1, (performance.now() - charObj.doneTime) / FADE_DURATION);
            }

            if (charObj && charObj.fontType === 'morse') {
              drawMorseVisualization(x, baseline, progress, cfs, isDeleting, fadeT, fg, charObj, isSecondary);
            } else {
              drawPartialGlyph(glyph, x, baseline, progress, cfs, isDeleting, fadeT, fg, charObj, isSecondary);
              if (!isSecondary) drawOutlineRipple(glyph, x, baseline, cfs, charObj, fg);
            }

            x += charW + effectiveKerning;
          }
        }
      }

      // Draw selection highlight for active layer
      if (selectAll) {
        ctx.fillStyle = 'rgba(' + fg + ', 0.08)';
        for (let dli = 0; dli < lastDisplayLines.length; dli++) {
          const dl = lastDisplayLines[dli];
          if (dl.chars.length === 0) continue;
          const bl = PADDING + ascender + dli * (lineHeight + LINE_GAP);
          const top = bl - ascender;
          const bottom = bl - descender;
          let x0 = PADDING + LABEL_MARGIN, x1 = x0;
          for (let i = 0; i < dl.glyphs.length; i++) {
            const cfs = getCharFontSize(dl.chars[i], FONT_SIZE);
            x1 += dl.glyphs[i].advanceWidth * (cfs / (font ? font.unitsPerEm : 1000));
            if (kerningEnabled) {
              x1 += (dl.chars[i] ? (dl.chars[i].kerning || 0) : 0) + getEffectiveKerning(i > 0 && dl.chars[i - 1] ? dl.chars[i - 1].char : null, dl.chars[i] ? dl.chars[i].char : null, globalKerning);
            }
          }
          ctx.fillRect(x0 - 2, top, x1 - x0 + 4, bottom - top);
        }
      }

      // Draw cursor for active layer
      if (cursorVisible) {
        let curDli = 0, curOff = cursorCol;
        let acc = 0;
        for (let dli = 0; dli < lastDisplayLines.length; dli++) {
          const displayLine = lastDisplayLines[dli];
          if (displayLine.srcLine !== cursorLine) {
            if (displayLine.srcLine > cursorLine) break;
            acc += displayLine.chars.length;
            continue;
          }
          if (displayLine.srcLine === cursorLine) {
            if (cursorCol <= acc + displayLine.chars.length) {
              curDli = dli;
              curOff = cursorCol - acc;
              break;
            }
            acc += displayLine.chars.length;
            curDli = dli;
            curOff = displayLine.chars.length;
          }
        }
        const cursorDisplayLine = lastDisplayLines[curDli];
        let curX = PADDING + LABEL_MARGIN;
        if (cursorDisplayLine) {
          const lFont = fontCache[activeLayer] || font;
          for (let i = 0; i < curOff && i < cursorDisplayLine.glyphs.length; i++) {
            const cfs = getCharFontSize(cursorDisplayLine.chars[i], FONT_SIZE);
            curX += cursorDisplayLine.glyphs[i].advanceWidth * (cfs / (lFont ? lFont.unitsPerEm : 1000));
            if (kerningEnabled) {
              curX += (cursorDisplayLine.chars[i] ? (cursorDisplayLine.chars[i].kerning || 0) : 0) + getEffectiveKerning(i > 0 && cursorDisplayLine.chars[i - 1] ? cursorDisplayLine.chars[i - 1].char : null, cursorDisplayLine.chars[i] ? cursorDisplayLine.chars[i].char : null, globalKerning);
            }
          }
        }
        const bl = PADDING + ascender + curDli * (lineHeight + LINE_GAP);
        ctx.strokeStyle = 'rgba(' + fg + ', 0.9)';
        ctx.lineWidth = 2.0;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(curX, bl - ascender);
        ctx.lineTo(curX, bl - descender);
        ctx.stroke();
        scrollCursorIntoView(bl);
      }
    }

    function drawMetricLines(canvasW, baseline, ascenderY, xHeightY, descenderY, fg) {
      if (!showMetrics) return;

      const lineYs = [ascenderY, xHeightY, baseline, descenderY];

      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 0.6;
      ctx.strokeStyle = 'rgb(' + fg + ')';

      for (let i = 0; i < lineYs.length; i++) {
        ctx.beginPath();
        ctx.moveTo(PADDING - 10, lineYs[i]);
        ctx.lineTo(canvasW - PADDING + 10, lineYs[i]);
        ctx.stroke();
      }

      ctx.setLineDash([]);
      ctx.restore();
    }

    function startAnimation(charObj) {
      window.startAnimation = startAnimation;
      const g = getGlyphForCharObj(charObj);
      const fs = getCharFontSize(charObj, FONT_SIZE);
      const path = g ? g.getPath(0, 0, fs) : { commands: [] };
      const totalCmds = path.commands.length || 1;

      charObj.done = false;
      animations.set(charObj.id, {
        progress: 0,
        startTime: performance.now(),
        totalCmds: totalCmds,
        direction: 1
      });
      scheduleFrame();
    }

    function startDeleteAnimation(charObj) {
      const g = getGlyphForCharObj(charObj);
      const fs = getCharFontSize(charObj, FONT_SIZE);
      const path = g ? g.getPath(0, 0, fs) : { commands: [] };
      const totalCmds = path.commands.length || 1;

      charObj.done = false;
      charObj.deleting = true;
      animations.set(charObj.id, {
        progress: 1,
        startTime: performance.now(),
        totalCmds: totalCmds,
        direction: -1
      });
      scheduleFrame();
    }

    let selectAll = false;

    function clearSelection() {
      selectAll = false;
    }

    function deleteAll() {
      for (const line of textData) {
        for (const c of line) animations.delete(c.id);
      }
      textData = [[]];
      layerTextData[activeLayer] = textData;
      cursorLine = 0;
      cursorCol = 0;
      selectAll = false;
    }

    function handleKeyDown(e) {
      if (!font) return;
      if (dMsgActive) dMsgStop();
      resetAutoplayTimer();
      const key = e.key;

      if (key === 'Tab') {
        const polyLayers = getActivePolyphonyLayers();
        if (polyphonyMode !== 'off' && polyLayers.length > 1) {
          e.preventDefault();
          const curIdx = polyLayers.indexOf(activeLayer);
          const nextIdx = (curIdx + 1) % polyLayers.length;
          updateActiveLayer(polyLayers[nextIdx]);
          return;
        }
      }

      if (key === 'a' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        selectAll = true;
        resetBlink();
        scheduleFrame();
        return;
      }

      if (selectAll && (key === 'Backspace' || key === 'Delete')) {
        e.preventDefault();
        deleteAll();
        resetBlink();
        scheduleFrame();
        return;
      }

      if (selectAll && key.length === 1 && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        if (e.repeat) return;
        deleteAll();
        const newChar = initCharObj({ char: key, id: charIdCounter++, done: false, kerning: 0, fontSize: FONT_SIZE });
        tagDesktopTyping(newChar);
        randomizeColors();
        layerTextData[activeLayer][0].push(newChar);
        cursorCol = 1;
        updateLayerCursor(activeLayer, 0, 1);
        if (activeKeyChar) releaseSustain(activeKeyChar);
        activeKeyChar = newChar;
        newChar._holdStart = performance.now();
        newChar._sustain = startSustain(newChar);
        activeKeyDownTime = performance.now();
        updatePlayback(newChar, 0, 1);
        triggerCharFlash(newChar);
        pronounceChar(key, false, newChar.fontType, newChar, { source: 'typing', textData, cursorLine: 0, cursorCol: 1 });
        startAnimation(newChar);
        resetBlink();
        scrollCameraToPlayback(false);
        return;
      }

      if (selectAll && key === 'Enter') {
        e.preventDefault();
        deleteAll();
        updatePlayback(null, 0, 0);
        resetBlink();
        scheduleFrame();
        scrollCameraToPlayback(false);
        return;
      }

      clearSelection();

      if (key === 'Backspace') {
        e.preventDefault();
        clearTimeout(englishWordTimer);
        if (cursorCol > 0) {
          const target = layerTextData[activeLayer][cursorLine][cursorCol - 1];
          if (target && !target.deleting) {
            triggerCharFlash(target);
            pronounceChar(target.char, true, target.fontType, target);
            startDeleteAnimation(target);
            cursorCol--;
            updateLayerCursor(activeLayer, cursorLine, cursorCol);
          }
        } else if (cursorLine > 0) {
          const prevLen = layerTextData[activeLayer][cursorLine - 1].length;
          layerTextData[activeLayer][cursorLine - 1] = layerTextData[activeLayer][cursorLine - 1].concat(layerTextData[activeLayer][cursorLine]);
          layerTextData[activeLayer].splice(cursorLine, 1);
          cursorLine--;
          cursorCol = prevLen;
          updateLayerCursor(activeLayer, cursorLine, cursorCol);
        }
        updatePlayback(null, cursorLine, cursorCol);
        resetBlink();
        scheduleFrame();
        scrollCameraToPlayback(false);
      } else if (key === 'Delete') {
        e.preventDefault();
        clearTimeout(englishWordTimer);
        if (cursorCol < layerTextData[activeLayer][cursorLine].length) {
          const target = layerTextData[activeLayer][cursorLine][cursorCol];
          if (target && !target.deleting) {
            triggerCharFlash(target);
            pronounceChar(target.char, true, target.fontType, target);
            startDeleteAnimation(target);
          }
        } else if (cursorLine < layerTextData[activeLayer].length - 1) {
          layerTextData[activeLayer][cursorLine] = layerTextData[activeLayer][cursorLine].concat(layerTextData[activeLayer][cursorLine + 1]);
          layerTextData[activeLayer].splice(cursorLine + 1, 1);
        }
        updateLayerCursor(activeLayer, cursorLine, cursorCol);
        updatePlayback(null, cursorLine, cursorCol);
        resetBlink();
        scheduleFrame();
        scrollCameraToPlayback(false);
      } else if (key === 'Enter') {
        e.preventDefault();
        if (soundEnabled && getActiveFontKey() === 'playfair-display') {
          clearTimeout(englishWordTimer);
          const completedWord = window.getWordBeforeCursor(textData, cursorLine, cursorCol);
          if (completedWord && completedWord !== lastSpokenEnglishWord) {
            lastSpokenEnglishWord = completedWord;
            lastSpokenEnglishTime = performance.now();
            speakEnglishWord(completedWord, 1.0);
          }
        }
        const rest = layerTextData[activeLayer][cursorLine].splice(cursorCol);
        layerTextData[activeLayer].splice(cursorLine + 1, 0, rest);
        cursorLine++;
        cursorCol = 0;
        updateLayerCursor(activeLayer, cursorLine, cursorCol);
        updatePlayback(null, cursorLine, cursorCol);
        resetBlink();
        scheduleFrame();
        scrollCameraToPlayback(false);
      } else if (key === 'ArrowLeft') {
        e.preventDefault();
        if (cursorCol > 0) cursorCol--;
        else if (cursorLine > 0) { cursorLine--; cursorCol = layerTextData[activeLayer][cursorLine].length; }
        updateLayerCursor(activeLayer, cursorLine, cursorCol);
        updatePlayback(null, cursorLine, cursorCol);
        resetBlink(); scheduleFrame();
        scrollCameraToPlayback(false);
      } else if (key === 'ArrowRight') {
        e.preventDefault();
        if (cursorCol < layerTextData[activeLayer][cursorLine].length) cursorCol++;
        else if (cursorLine < layerTextData[activeLayer].length - 1) { cursorLine++; cursorCol = 0; }
        updateLayerCursor(activeLayer, cursorLine, cursorCol);
        updatePlayback(null, cursorLine, cursorCol);
        resetBlink(); scheduleFrame();
        scrollCameraToPlayback(false);
      } else if (key === 'ArrowUp') {
        e.preventDefault();
        if (cursorLine > 0) { cursorLine--; cursorCol = Math.min(cursorCol, layerTextData[activeLayer][cursorLine].length); }
        updateLayerCursor(activeLayer, cursorLine, cursorCol);
        updatePlayback(null, cursorLine, cursorCol);
        resetBlink(); scheduleFrame();
        scrollCameraToPlayback(false);
      } else if (key === 'ArrowDown') {
        e.preventDefault();
        if (cursorLine < layerTextData[activeLayer].length - 1) { cursorLine++; cursorCol = Math.min(cursorCol, layerTextData[activeLayer][cursorLine].length); }
        updateLayerCursor(activeLayer, cursorLine, cursorCol);
        updatePlayback(null, cursorLine, cursorCol);
        resetBlink(); scheduleFrame();
        scrollCameraToPlayback(false);
      } else if (key === 'Home') {
        e.preventDefault(); cursorCol = 0; clearSelection(); updatePlayback(null, cursorLine, cursorCol); resetBlink(); scheduleFrame(); scrollCameraToPlayback(false);
      } else if (key === 'End') {
        e.preventDefault(); cursorCol = layerTextData[activeLayer][cursorLine].length; clearSelection(); updatePlayback(null, cursorLine, cursorCol); resetBlink(); scheduleFrame(); scrollCameraToPlayback(false);
      } else if (key.length === 1 && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        if (e.repeat) return;
        const newChar = initCharObj({ char: key, id: charIdCounter++, done: false, kerning: 0, fontSize: FONT_SIZE });
        tagDesktopTyping(newChar);
        randomizeColors();
        layerTextData[activeLayer][cursorLine].splice(cursorCol, 0, newChar);
        cursorCol++;
        updateLayerCursor(activeLayer, cursorLine, cursorCol);
        if (activeKeyChar) releaseSustain(activeKeyChar);
        activeKeyChar = newChar;
        newChar._holdStart = performance.now();
        newChar._sustain = startSustain(newChar);
        activeKeyDownTime = performance.now();
        updatePlayback(newChar, cursorLine, cursorCol);
        triggerCharFlash(newChar);
        pronounceChar(key, false, newChar.fontType, newChar, { source: 'typing', layerTextData, cursorLine, cursorCol });
        startAnimation(newChar);
        resetBlink();
        scrollCameraToPlayback(false);
      }
    }

    function handleKeyUp(e) {
      if (activeKeyChar && e.key === activeKeyChar.char) {
        releaseSustain(activeKeyChar);
        activeKeyChar = null;
        scheduleFrame();
      }
    }

    canvas.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keydown', (e) => {
      if (isMobile) return;
      const activeEl = document.activeElement;
      if (activeEl === canvas || activeEl === hiddenInput) return;
      if (activeEl && (activeEl.tagName === 'SELECT' || (activeEl.tagName === 'INPUT' && activeEl.type === 'range'))) {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Escape'].includes(e.key)) return;
        activeEl.blur();
      }
      canvas.focus();
      handleKeyDown(e);
    });

    canvas.addEventListener('keyup', handleKeyUp);
    window.addEventListener('keyup', (e) => {
      if (document.activeElement !== canvas) handleKeyUp(e);
    });

    const typoCol = document.getElementById('typography-column');
    if (typoCol) {
      typoCol.addEventListener('click', (e) => {
        if (e.target !== canvas) {
          if (isMobile) {
            hiddenInput.focus();
          } else {
            canvas.focus();
          }
        }
      });
    }

    function handlePointerAt(clientX, clientY) {
      if (!font || lastDisplayLines.length === 0) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      const scale = FONT_SIZE / font.unitsPerEm;
      const ascender = font.ascender * scale;
      const descender = font.descender * scale;
      const lineHeight = (ascender - descender) * DESKTOP_LINE_HEIGHT_RATIO;

      let bestDli = 0;
      let bestDist = Infinity;
      for (let dli = 0; dli < lastDisplayLines.length; dli++) {
        const bl = PADDING + ascender + dli * (lineHeight + LINE_GAP);
        const midY = bl - ascender / 2;
        const dist = Math.abs(clickY - midY);
        if (dist < bestDist) { bestDist = dist; bestDli = dli; }
      }
      const dl = lastDisplayLines[bestDli];
      cursorLine = dl.srcLine;

      let bestCol = 0;
      let bestColDist = Infinity;
      let x = PADDING + LABEL_MARGIN;
      for (let i = 0; i <= dl.chars.length; i++) {
        const dist = Math.abs(clickX - x);
        if (dist < bestColDist) { bestColDist = dist; bestCol = i; }
        if (i < dl.chars.length && i < dl.glyphs.length) {
          const cfs = (dl.chars[i] && sizeEnabled) ? dl.chars[i].fontSize : FONT_SIZE;
          x += dl.glyphs[i].advanceWidth * (cfs / font.unitsPerEm);

          // Get previous character for optical kerning
          const prevChar = i > 0 && dl.chars[i - 1] ? dl.chars[i - 1].char : null;
          const currentChar = dl.chars[i] ? dl.chars[i].char : null;

          // Apply kerning based on mode
          let effectiveKerning = 0;
          if (kerningEnabled) {
            effectiveKerning = dl.chars[i].kerning || 0;
          }
          effectiveKerning += getEffectiveKerning(prevChar, currentChar, globalKerning);

          x += effectiveKerning;
        }
      }
      cursorCol = dl.srcCol + bestCol;
      updateLayerCursor(activeLayer, cursorLine, cursorCol);
      clearSelection();
      updatePlayback(null, cursorLine, cursorCol);
      resetBlink(); scheduleFrame();
      scrollCameraToPlayback(false);
    }

    canvas.addEventListener('click', (e) => {
      if (isMobile) {
        hiddenInput.focus();
      } else {
        canvas.focus();
      }
      handlePointerAt(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      hiddenInput.focus();
      const t = e.touches[0];
      handlePointerAt(t.clientX, t.clientY);
    }, { passive: false });

    function insertChar(key) {
      if (dMsgActive) dMsgStop();
      resetAutoplayTimer();
      if (selectAll) {
        deleteAll();
      }
      clearSelection();
      const newChar = initCharObj({ char: key, id: charIdCounter++, done: false, kerning: 0, fontSize: FONT_SIZE });
      tagDesktopTyping(newChar);
        randomizeColors();
      layerTextData[activeLayer][cursorLine].splice(cursorCol, 0, newChar);
      cursorCol++;
      updateLayerCursor(activeLayer, cursorLine, cursorCol);
      updatePlayback(newChar, cursorLine, cursorCol);
      triggerCharFlash(newChar);
      pronounceChar(key, false, newChar.fontType, newChar, { source: 'typing', textData, cursorLine, cursorCol });
      startAnimation(newChar);
      resetBlink();
      scrollCameraToPlayback(false);
    }

    function doBackspace() {
      if (dMsgActive) { dMsgStop(); resetBlink(); scheduleFrame(); return; }
      resetAutoplayTimer();
      clearTimeout(englishWordTimer);
      if (selectAll) {
        deleteAll();
        resetBlink();
        scheduleFrame();
        return;
      }
      clearSelection();
      if (cursorCol > 0) {
        const target = layerTextData[activeLayer][cursorLine][cursorCol - 1];
        if (target && !target.deleting) {
          triggerCharFlash(target);
          pronounceChar(target.char, true, target.fontType, target);
          startDeleteAnimation(target);
          cursorCol--;
          updateLayerCursor(activeLayer, cursorLine, cursorCol);
        }
      } else if (cursorLine > 0) {
        const prevLen = layerTextData[activeLayer][cursorLine - 1].length;
        layerTextData[activeLayer][cursorLine - 1] = layerTextData[activeLayer][cursorLine - 1].concat(layerTextData[activeLayer][cursorLine]);
        layerTextData[activeLayer].splice(cursorLine, 1);
        cursorLine--;
        cursorCol = prevLen;
        updateLayerCursor(activeLayer, cursorLine, cursorCol);
      }
      updatePlayback(null, cursorLine, cursorCol);
      resetBlink();
      scheduleFrame();
      scrollCameraToPlayback(false);
    }

    hiddenInput.addEventListener('input', (e) => {
      const val = hiddenInput.value;
      if (val.length > 0) {
        for (const ch of val) {
          insertChar(ch);
        }
      }
      hiddenInput.value = '';
    });

    hiddenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace') {
        e.preventDefault();
        doBackspace();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (selectAll) { deleteAll(); }
        clearSelection();
        const rest = layerTextData[activeLayer][cursorLine].splice(cursorCol);
        textData.splice(cursorLine + 1, 0, rest);
        cursorLine++;
        cursorCol = 0;
        updatePlayback(null, cursorLine, cursorCol);
        resetBlink();
        scheduleFrame();
        scrollCameraToPlayback(false);
      }
    });

    if (isMobile) {
      setupMobileUI();
    }

    window.addEventListener('resize', () => {
      scheduleFrame();
      if (isMobile && typeof mobileRedraw === 'function') mobileRedraw();
    });
    loadFont(true).then(() => {
      canvas.focus();
      scheduleFrame();
      
      // Initialize audio context for default sound on
      if (soundEnabled) {
        const ctx = getDrumCtx();
        if (ctx.state === 'suspended') ctx.resume();
        try {
          const u = new SpeechSynthesisUtterance('');
          u.volume = 0;
          window.speechSynthesis.speak(u);
        } catch (e) {}
        updateSoundToggleUI();
      }
    }).catch(err => {
      console.error('Font loading failed:', err);
    });

    setTimeout(() => {
      const hint = document.getElementById('sound-hint');
      if (hint) {
        hint.classList.add('show');
        setTimeout(() => hint.classList.remove('show'), 4000);
        hint.addEventListener('click', (e) => { e.stopPropagation(); hint.classList.remove('show'); });
      }
    }, 3000);

    /* ===== Mobile Patatap-style UI ===== */
    function setupMobileUI() {
      document.getElementById('mobileUI').classList.add('visible');
      const wsGrid = document.getElementById('workspace-grid');
      if (wsGrid) wsGrid.style.display = 'none';
      document.getElementById('controls').style.display = 'none';
      if (soundMatrixPanel) soundMatrixPanel.style.display = 'none';
      canvas.style.display = 'none';
      hiddenInput.style.display = 'none';

      const mCanvas = document.getElementById('mobileCanvas');
      const mCtx = mCanvas.getContext('2d');
      const grid = document.getElementById('letterGrid');

      const ROWS = [
        ['1','2','3','4','5','6','7','8','9','0'],
        ['Q','W','E','R','T','Y','U','I','O','P'],
        ['A','S','D','F','G','H','J','K','L'],
        ['Z','X','C','V','B','N','M','⌫'],
        ['!','?',',','␣','.','-','⏎'],
      ];

      ROWS.forEach((row, ri) => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'kb-row';
        row.forEach(item => {
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.textContent = item;
          cell.dataset.key = item;
          if (item === '⌫' || item === '⏎') {
